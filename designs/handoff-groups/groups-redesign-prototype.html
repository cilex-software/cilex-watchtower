<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Groups — Wall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1a1816;--panel:#221f1c;--panel2:#2a2722;--panel3:#322e28;--line:#34302a;--line2:#443f37;--ink:#f0ece4;--ink2:#a89f90;--ink3:#6e6657;--accent:#e8a13a;--accentSoft:rgba(232,161,58,.08);--accentDim:#5a3f15;--bad:#d96649;--badSoft:rgba(217,102,73,.1);--good:#8eb96b;--info:#6f9bc4}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#100f0e;font-family:'Space Grotesk',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh;display:block;overflow-x:auto;padding:16px 20px 24px}
.wrap{width:max-content;margin:0 auto}
.mono{font-family:'JetBrains Mono',monospace}
a{color:var(--accent)}a:hover{color:var(--ink)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:left}
input{font:inherit;color:inherit;background:none;border:none;outline:none}
::-webkit-scrollbar{width:3px;height:3px}::-webkit-scrollbar-thumb{background:var(--line2)}::-webkit-scrollbar-track{background:transparent}
.vbar{display:flex;align-items:center;gap:10px;padding:0 2px 10px}
.vsw{display:flex;align-items:stretch;border:1px solid var(--line2)}
.vsw a{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink3);text-decoration:none;padding:3px 9px;border-right:1px solid var(--line2)}
.vsw a:last-child{border-right:0}
.vsw a:hover{background:var(--panel2);color:var(--ink)}
.vsw a.on{background:var(--accent);color:#241a08;font-weight:700}
.vnote{font-size:11px;color:var(--ink3)}
.vnote b{color:var(--ink2);font-weight:500}
.frame{background:var(--bg);border:1px solid var(--line2);height:900px;display:flex;flex-direction:column;overflow:hidden;flex:none;min-width:0;position:relative;transition:width .18s ease}
.osbar{height:30px;background:#141312;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 12px;gap:9px;flex:none}
.osdot{width:8px;height:8px;border-radius:50%}
.osttl{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1.4px;color:var(--ink3);text-transform:uppercase}
.body{flex:1;display:flex;min-height:0}
.rail{width:64px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;flex:none}
.railbrand{height:44px;display:grid;place-items:center;border-bottom:1px solid var(--line);color:var(--accent);font-weight:700;font-size:13px}
.railitem{height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:'JetBrains Mono',monospace;font-size:7.5px;letter-spacing:.8px;color:var(--ink3);border-bottom:1px solid var(--line);position:relative}
.railitem .g{width:15px;height:15px;border:1px solid currentColor}
.railitem.on{color:var(--accent);background:var(--accentSoft)}
.railitem .bdg{position:absolute;top:7px;right:7px;background:var(--bad);color:#fff;font-size:7px;padding:0 3px;font-weight:700}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:52px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:stretch;flex:none}
.tcell{display:flex;align-items:center;padding:0 13px;border-right:1px solid var(--line);flex:none;gap:9px}
.tcell.grow{flex:1;min-width:0}
.brand .b1{font-family:'JetBrains Mono',monospace;font-size:7.5px;letter-spacing:1.5px;color:var(--ink3)}
.brand .b2{font-size:14px;font-weight:600;letter-spacing:-.2px;line-height:1.1}
.searchc{color:var(--ink3);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.kbd{font-family:'JetBrains Mono',monospace;font-size:8px;border:1px solid var(--line);padding:1px 4px;color:var(--ink3);letter-spacing:.6px;flex:none}
.pill{display:flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink2);letter-spacing:.7px;white-space:nowrap}
.pill i{width:6px;height:6px;display:block;flex:none}
.tabstrip{height:30px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:stretch;flex:none}
.tabstrip .t{display:flex;align-items:center;gap:8px;padding:0 13px;font-size:11px;color:var(--ink3);border-right:1px solid var(--line);white-space:nowrap}
.tabstrip .t.on{background:var(--panel);color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
.panes{flex:1;display:flex;min-height:0}
/* ── LEFT ── */
.left{width:264px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--bg)}
.lsearch{height:30px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:7px;padding:0 10px;flex:none;background:var(--panel)}
.lsearch .gl{font-size:11px;color:var(--ink3)}
.lsearch input{flex:1;min-width:0;font-family:'JetBrains Mono',monospace;font-size:11px;caret-color:var(--accent)}
.lsearch input::placeholder{font-family:'Space Grotesk',sans-serif;font-size:11px;color:var(--ink3)}
.llist{flex:1;overflow-y:auto;min-height:0}
.gsec{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:1.4px;color:var(--ink3);padding:6px 10px 4px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px}
.grp{width:100%;height:34px;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--line);position:relative}
.grp:hover{background:var(--panel2)}
.grp.on{background:var(--accentSoft);box-shadow:inset 3px 0 0 var(--accent)}
.grp.dz{background:var(--accentSoft);box-shadow:inset 0 0 0 1px var(--accent)}
.grp .gi{width:12px;height:12px;border:1px solid var(--ink3);flex:none}
.grp.on .gi{border-color:var(--accent)}
.grp .gn{font-size:12px;color:var(--ink2);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp.on .gn{color:var(--accent);font-weight:600}
.grp .gc{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink3);flex:none}
.grp.on .gc{color:var(--accent)}
.hb{display:flex;height:3px;width:34px;flex:none;gap:1px;background:var(--panel3)}
.hb i{display:block;height:3px}
.gempty{font-family:'JetBrains Mono',monospace;font-size:8.5px;color:var(--ink3);flex:none;letter-spacing:.6px}
.newg{height:34px;border-top:1px solid var(--line2);display:flex;align-items:center;gap:8px;padding:0 10px;flex:none;background:var(--panel);color:var(--ink2);font-size:12px;width:100%}
.newg:hover{background:var(--panel2);color:var(--ink)}
.newg .p{color:var(--accent);font-size:13px}
.newg.edit{background:var(--panel2)}
.newg input{flex:1;min-width:0;font-size:12px;caret-color:var(--accent);border-bottom:1px solid var(--accent)}
.newg .ok{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--accent);border:1px solid var(--accent);padding:1px 5px;flex:none}
.newg .no{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--ink3);padding:1px 4px;flex:none}
/* B · cards — rows grow to divide the column, and the space they gain shows what is IN each group */
.gcards{flex:1;display:flex;flex-direction:column;min-height:0;overflow-y:auto}
.gcard{flex:1 1 0;min-height:76px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;position:relative;text-align:left;width:100%}
.gcard:hover{background:var(--panel2)}
.gcard.on{background:var(--accentSoft);box-shadow:inset 3px 0 0 var(--accent)}
.gcard.dz{box-shadow:inset 0 0 0 1px var(--accent)}
.gcard .gh2{height:28px;display:flex;align-items:center;gap:7px;padding:0 10px;flex:none}
.gstrip{flex:1;min-height:0;display:flex;flex-wrap:wrap;gap:2px;align-content:flex-start;overflow:hidden;padding:0 10px 8px}
.gt{width:35px;height:20px;position:relative;overflow:hidden;background:#141312;flex:none}
.gt .gtb{position:absolute;left:0;right:0;bottom:0;height:2px;z-index:2}
.gcard .gnone{padding:0 10px 9px;font-size:10.5px;color:var(--ink3)}
/* C · console — compact rows, and the leftover height carries what needs attention */
.gcon{border-top:1px solid var(--line2);background:var(--panel);flex:1;min-height:0;display:flex;flex-direction:column;overflow-y:auto}
.gconh{height:22px;display:flex;align-items:center;padding:0 10px;font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:1.4px;color:var(--ink3);border-bottom:1px solid var(--line);flex:none}
.att{height:32px;display:flex;align-items:center;gap:9px;padding:0 10px;border-bottom:1px solid var(--line);flex:none;width:100%;text-align:left}
.att:hover{background:var(--panel2)}
.att.on{background:var(--accentSoft)}
.att .an{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;min-width:24px;flex:none;color:var(--ink3)}
.att.b .an{color:var(--bad)}.att.w .an{color:var(--accent)}
.att .al{font-size:11px;color:var(--ink2);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att .ak{font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--ink3);flex:none}
.fleetbar{margin:9px 10px;height:6px;display:flex;gap:1px;background:var(--panel3);flex:none}
.fleetbar i{display:block;height:6px}
/* the summary rows are fixed, so ONE child must be able to grow into the remainder — otherwise
   flexing the container only moves the void inside it. The work queue is that child: it is long
   whenever the fleet has faults, and it scrolls rather than stretching when it is longer still. */
.exl{flex:1;min-height:0;overflow-y:auto;border-top:1px solid var(--line2);display:flex;flex-direction:column}
.exh{height:20px;display:flex;align-items:center;gap:7px;padding:0 10px;font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:1.3px;color:var(--ink3);background:var(--bg);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2;flex:none}
.exr{height:26px;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--line);width:100%;text-align:left;flex:none}
.exr:hover{background:var(--panel2)}
.exr .ed{width:5px;height:5px;border-radius:50%;flex:none}
.exr .eo{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;color:var(--ink2);flex:none;min-width:32px}
.exr:hover .eo{color:var(--ink)}
.exr .er{font-size:10px;color:var(--ink3);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exok{flex:1;display:grid;place-items:center;padding:22px 14px;text-align:center;font-size:11px;color:var(--ink3);line-height:1.5}
.fleetlbl{padding:0 10px 10px;font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:1px;color:var(--ink3);display:flex;gap:9px;flex:none}
/* D · bar — the pane is deleted and its 264px go back to the wall */
.gbar{height:32px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:5px;padding:0 10px;background:var(--bg);flex:none;overflow-x:auto;overflow-y:hidden}
.gc2{height:22px;display:flex;align-items:center;gap:6px;padding:0 8px;box-shadow:inset 0 0 0 1px var(--line2);font-size:11px;color:var(--ink2);flex:none;white-space:nowrap}
.gc2:hover{background:var(--panel2);color:var(--ink)}
.gc2.on{background:var(--accentSoft);box-shadow:inset 0 0 0 1px var(--accent);color:var(--accent);font-weight:600}
.gc2.dz{box-shadow:inset 0 0 0 1px var(--accent)}
.gc2 .n2{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink3)}
.gc2.on .n2{color:var(--accent)}
.gc2 .hb2{width:22px;height:3px;display:flex;gap:1px;background:var(--panel3);flex:none}
.gc2 .hb2 i{display:block;height:3px}
.gbsep{width:1px;height:16px;background:var(--line);flex:none;margin:0 3px}
/* ── RIGHT ── */
.right{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}
.rhead{height:34px;border-bottom:1px solid var(--line);display:flex;align-items:stretch;flex:none;background:var(--panel)}
.rname{display:flex;align-items:center;padding:0 12px;gap:9px;min-width:0;flex:none;max-width:52%}
.rname .n{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rname input{font-size:14px;font-weight:600;background:var(--bg);border:1px solid var(--accent);padding:1px 5px;min-width:0;width:180px;caret-color:var(--accent)}
.rname .c{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink3);flex:none}
.rspacer{flex:1;border-right:1px solid var(--line);min-width:0}
.rb{display:flex;align-items:center;gap:6px;padding:0 11px;border-left:1px solid var(--line);font-size:11px;color:var(--ink3);white-space:nowrap;flex:none}
.rb:hover{background:var(--panel2);color:var(--ink)}
.rb.danger:hover{color:var(--bad)}
.rb.armed{background:#2c211d;color:var(--bad)}
.rb.q{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--bad);cursor:default;background:#2c211d}
.rb.yes{color:var(--bad);font-weight:700}
.fbar{height:30px;border-bottom:1px solid var(--line);display:flex;align-items:stretch;flex:none;background:var(--bg);position:relative;z-index:6}
.fs{display:flex;align-items:center;gap:7px;padding:0 10px;border-right:1px solid var(--line);flex:none;width:196px}
.fs .gl{font-size:11px;color:var(--ink3)}
.fs input{flex:1;min-width:0;font-family:'JetBrains Mono',monospace;font-size:11px;caret-color:var(--accent)}
.fs input::placeholder{font-family:'Space Grotesk',sans-serif;font-size:10.5px;color:var(--ink3)}
.fb2{display:flex;align-items:center;gap:7px;padding:0 11px;border-right:1px solid var(--line);font-size:11px;color:var(--ink3);white-space:nowrap;flex:none}
.fb2:hover{background:var(--panel2);color:var(--ink2)}
.fb2.on{background:var(--accentSoft);color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent);font-weight:600}
.fb2 .c{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink3)}
.fb2.on .c{color:var(--accent)}
.fb2.warn.on{background:rgba(217,102,73,.12);color:var(--bad);box-shadow:inset 0 -2px 0 var(--bad)}
.fb2.warn.on .c{color:var(--bad)}
.fspacer{flex:1;border-right:1px solid var(--line);min-width:0}
.fstat{display:flex;align-items:center;padding:0 11px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink3);flex:none;gap:7px}
.fstat b{color:var(--ink2);font-weight:600}
.fstat.warn b{color:var(--bad)}
.scroll{flex:1;overflow-y:auto;min-height:0;position:relative}
/* gapless mosaic — tiles butt edge to edge; every state is an INSET ring so it costs no layout */
.wallw{display:grid;gap:0;line-height:0}
/* the scroll gutter is the last 3px before the pane edge: on a gapless wall a lighter track reads as
   a seam, so the track takes the tile colour and the wall appears to run to the edge */
.scroll::-webkit-scrollbar-track{background:#141312}
.scroll::-webkit-scrollbar{width:3px}
.tile{position:relative;overflow:hidden;background:#141312;cursor:pointer;display:block;padding:0;border:0;line-height:0;width:100%;min-width:0}
.im{position:absolute;inset:0;overflow:hidden}
.im i{position:absolute;display:block}
.ph{position:absolute;inset:0;display:grid;place-items:center;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink3)}
.tile::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:6;box-shadow:inset 0 0 0 1px rgba(0,0,0,.55)}
.tile.fault::after{box-shadow:inset 0 0 0 2px var(--bad)}
.tile.warn::after{box-shadow:inset 0 0 0 1px rgba(232,161,58,.55)}
.tile.sel::after{box-shadow:inset 0 0 0 2px var(--accent)}
.tile.drag{opacity:.45}
/* bottom scrim = the only chrome, painted ON the frame */
.sc{position:absolute;left:0;right:0;bottom:0;z-index:4;display:flex;align-items:center;gap:6px;padding:0 6px;line-height:1;
  background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.5) 38%,rgba(0,0,0,.86) 100%)}
.tile.sel .sc{background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(90,63,21,.55) 38%,rgba(120,80,18,.92) 100%)}
.sc .o{font-family:'JetBrains Mono',monospace;font-weight:600;color:#fff;flex:none;text-shadow:0 1px 2px rgba(0,0,0,.9)}
.sc .nmx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:rgba(255,255,255,.9);text-shadow:0 1px 2px rgba(0,0,0,.9)}
.sc .nmx.un{color:rgba(255,255,255,.5)}
.sc input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--accent);color:var(--ink);padding:0 4px;height:19px;font-size:11.5px;caret-color:var(--accent)}
.sc .unm{font-family:'JetBrains Mono',monospace;font-size:7.5px;letter-spacing:.8px;color:var(--accent);border:1px solid var(--accentDim);background:rgba(232,161,58,.16);padding:0 3px;flex:none}
.sc .svd{font-family:'JetBrains Mono',monospace;font-size:7.5px;letter-spacing:.8px;color:var(--good);flex:none;animation:fade 1.4s ease forwards}
@keyframes fade{0%,60%{opacity:1}100%{opacity:0}}
/* top row: status marker + online dot + checkbox */
.tp{position:absolute;left:0;right:0;top:0;z-index:5;display:flex;align-items:flex-start;gap:5px;padding:4px 5px;line-height:1}
.od{width:5px;height:5px;border-radius:50%;flex:none;margin-top:2px;box-shadow:0 0 0 1px rgba(0,0,0,.6)}
.mk{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:.8px;font-weight:700;padding:1px 4px;flex:none;white-space:nowrap}
.mk.b{background:var(--bad);color:#fff}
.mk.w{background:rgba(0,0,0,.66);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.mk.o{background:rgba(0,0,0,.66);color:var(--ink3);box-shadow:inset 0 0 0 1px var(--ink3)}
.cb{width:14px;height:14px;flex:none;display:grid;place-items:center;font-size:10px;color:transparent;background:rgba(20,19,18,.72);box-shadow:inset 0 0 0 1px var(--line2)}
.tile.sel .cb{background:var(--accent);color:#241a08;box-shadow:inset 0 0 0 1px var(--accent)}
.tile:not(:hover):not(.sel) .cb{opacity:0}
/* hover-only row: full badge + group chip, above the scrim */
.hv{position:absolute;left:0;right:0;z-index:5;display:none;align-items:center;gap:5px;padding:0 5px;line-height:1}
.tile:hover .hv{display:flex}
.bdg{display:flex;align-items:center;gap:4px;font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.6px;flex:none;padding:1px 4px;background:rgba(20,19,18,.8);white-space:nowrap}
.bdg i{width:4px;height:4px;border-radius:50%;flex:none}
.bdg.ok{color:var(--ink2)}
.bdg.warnb{color:var(--accent)}
.bdg.badb{color:#fff;background:var(--bad)}
.bdg.offb{color:var(--ink3)}
.gchip{font-family:'JetBrains Mono',monospace;font-size:8.5px;color:rgba(255,255,255,.82);background:rgba(20,19,18,.8);box-shadow:inset 0 0 0 1px var(--line2);padding:1px 4px;flex:none;display:flex;align-items:center;gap:4px;max-width:104px;margin-left:auto}
.gchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gchip:hover{box-shadow:inset 0 0 0 1px var(--accent);color:var(--accent)}
.gchip.none{color:var(--accent);box-shadow:inset 0 0 0 1px var(--accentDim)}
.gchip.ro{cursor:default}
/* D · modal lightbox — the ONLY variant that covers the wall, so the wall stays legible behind it */
.scrim2{position:absolute;inset:0;z-index:30;background:rgba(13,12,11,.62);-webkit-backdrop-filter:blur(7px) saturate(70%);backdrop-filter:blur(7px) saturate(70%);display:flex;align-items:center;justify-content:center}
.modal{background:var(--panel);border:1px solid var(--line2);display:flex;flex-direction:column;min-width:0;line-height:1.35;cursor:default;overflow:hidden}
.mhd{height:30px;display:flex;align-items:center;gap:9px;padding:0 4px 0 11px;border-bottom:1px solid var(--line);flex:none}
.mhd .o{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;color:var(--accent);flex:none}
.mhd .nm3{font-size:13px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mhd .nm3.un{color:var(--ink3);font-weight:400}
.mhd input{flex:1;min-width:0;font-size:13px;font-weight:600;background:var(--bg);border:1px solid var(--accent);padding:1px 5px;caret-color:var(--accent)}
.mhd .pos{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--ink3);flex:none}
.mhd .x{width:24px;height:24px;display:grid;place-items:center;color:var(--ink3);font-size:12px;flex:none}
.mhd .x:hover{background:var(--panel2);color:var(--ink)}

/* D · modal lightbox. Prev/Next walk the CURRENT filtered order, so the modal is a reading position
   in the wall rather than a detached window — closing returns you to a wall you never lost. */
function NavPlate({dir,cam,t,thumbs,onClick}){
  if(!cam)return <span className={'nav end '+dir}><span className="lbl">{dir==='p'?t.listStart:t.listEnd}</span></span>;

  </span>;

    <span className="po">{'.'+cam.oct}</span>

  return <button className={'nav '+dir} onClick={onClick} title={(dir==='p'?t.prev:t.next)+' · '+(cam.name||cam.model)}>
    {dir==='p'?<>{thumb}{meta}</>:<>{meta}{thumb}</>}
  </button>;}

const UI_IDLE=2600;
function Modal({c,t,groups,canEdit,thumbs,idx,total,prevCam,nextCam,frameW,frameH,editing,onEdit,onCommit,onCancel,onChip,onPrev,onNext,onClose}){

  const [ui,setUi]=useState(true),idleT=useRef(null);

  const w=Math.round(frameW*0.84),chrome=60,vh=Math.min(Math.round(w*9/16),Math.round(frameH*0.86)-chrome);

        <button className="mf">▤ {t.live}</button>

/* popup geometry is derived from its row count, never assumed: rows = groups + 1 ("Ungrouped"),
   row 28px, 1px border each side. Flips above the chip when it would overflow, and clamps BOTH
   axes with a lower bound as well as an upper one. */
const GPOP_W=188,GPOP_ROW=28,GPOP_PAD=2,GPOP_M=6;
function placeChip(oct,e,groupCount){
  const r=e.currentTarget.getBoundingClientRect(),f=e.currentTarget.closest('.frame').getBoundingClientRect();
  const hh=(groupCount+1)*GPOP_ROW+GPOP_PAD;
  let y=r.bottom-f.top+2;
  if(y+hh>f.height-GPOP_M)y=r.top-f.top-hh-2;              // flip above
  y=Math.max(GPOP_M,Math.min(y,f.height-hh-GPOP_M));       // clamp, floor included
  const x=Math.max(GPOP_M,Math.min(r.left-f.left,f.width-GPOP_W-GPOP_M));
  return{oct,x,y,maxH:f.height-2*GPOP_M};
}

function App(){

            <div className="tcell" style={{padding:0}}><div style={{width:34,height:'100%',background:'var(--accent)',color:'#241a08',display:'grid',placeItems:'center',fontSize:11,fontWeight:700}}>{tw.role==='viewer'?'VW':tw.role==='engineer'?'EN':'AD'}</div></div>
          </div>
          <div className="tabstrip"><div className="t on">{t.screen}</div><div className="t">HiWatch DS-I456Z… (192.168.1.150)</div></div>
          <div className="panes">
            {tw.groupPane!=='bar'&&<div className="left">
              <div className="lsearch"><span className="gl">⌕</span>
                <input value={gq} onChange={e=>setGq(e.target.value)} placeholder={t.search}/>
              </div>
              {tw.groupPane==='cards'
                ?<div className="gcards">
                  <GroupCard id="all" label={t.all}/>
                  {counts.none>0&&<GroupCard id="none" label={t.ungrouped}/>}
                  {gList.map(g=><GroupCard key={g.id} id={g.id} label={g.en}/>)}
                  {gList.length===0&&<div style={{padding:'12px 10px',fontSize:11,color:'var(--ink3)'}}>{t.nores(gq)}</div>}
                </div>
                :<div className="llist" style={tw.groupPane==='console'?{flex:'none'}:null}>
                  <GroupRow id="all" label={t.all} icon="all"/>
                  {counts.none>0&&<GroupRow id="none" label={t.ungrouped}/>}
                  <div className="gsec">{t.gsec}<span style={{flex:1}}></span><span>{groups.length}</span></div>
                  {gList.map(g=><GroupRow key={g.id} id={g.id} label={g.en}/>)}
                  {gList.length===0&&<div style={{padding:'12px 10px',fontSize:11,color:'var(--ink3)'}}>{t.nores(gq)}</div>}
                </div>}
              {tw.groupPane==='console'&&<div className="gcon">
                <div className="gconh">{t.attention}</div>
                {att.map(a=><button key={a.k} className={'att '+(a.n?a.c:'')} onClick={a.go}>
                  <span className="an">{a.n}</span><span className="al">{a.l}</span>
                  {a.n>0&&<span className="ak">→</span>}
                </button>)}
                <span className="fleetbar">
                  {fh.bad?<i style={{background:'var(--bad)',flex:fh.bad}}></i>:null}
                  {fh.warn?<i style={{background:'var(--accent)',flex:fh.warn}}></i>:null}
                  {fh.ok?<i style={{background:'var(--good)',flex:fh.ok}}></i>:null}
                </span>
                <span className="fleetlbl" style={{paddingBottom:9}}><span style={{color:'var(--bad)'}}>{fh.bad} {t.hFault}</span>
                  <span style={{color:'var(--accent)'}}>{fh.warn} {t.hWarn}</span>
                  <span style={{color:'var(--good)'}}>{fh.ok} {t.hOk}</span>
                  <span style={{marginLeft:'auto'}}>{Math.round(fh.ok/ftot*100)}% {t.healthy}</span></span>
                <div className="exl">
                  {exList.length===0
                    ?<span className="exok">{t.exClear}</span>
                    :<><div className="exh">{t.exQueue}<span style={{flex:1}}></span><span>{exList.length}</span></div>
                      {exList.map(x=><button key={x.c.oct} className="exr"
                        onClick={()=>{setScope('all');setFace('all');setCq('');setFocus(x.c.oct);}}>
                        <span className="ed" style={{background:x.dot}}></span>
                        <span className="eo">{'.'+x.c.oct}</span>
                        <span className="er">{x.c.name||x.why}</span>
                        {x.c.name&&<span className="er" style={{flex:'none',maxWidth:96,textAlign:'right'}}>{x.why}</span>}
                      </button>)}</>}
                </div>
              </div>}
              {canEdit&&(newG?
                <div className="newg edit">
                  <span className="p">+</span>
                  <input autoFocus placeholder={t.newph}
                    onKeyDown={e=>{if(e.key==='Enter'){const v=e.target.value.trim();
                        if(v){const id='g'+Date.now();setGroups(g=>[...g,{id,en:v,ru:v}]);setScope(id);}setNewG(false);}
                      else if(e.key==='Escape')setNewG(false);}}
                    onBlur={e=>{const v=e.target.value.trim();
                      if(v){const id='g'+Date.now();setGroups(g=>[...g,{id,en:v,ru:v}]);setScope(id);}setNewG(false);}}/>
                  <span className="ok">↵</span><button className="no" onMouseDown={()=>setNewG(false)}>✕</button>
                </div>
                :<button className="newg" onClick={()=>setNewG(true)}><span className="p">+</span>{t.newg}</button>)}
            </div>}
            <div className="right">
              <div className="rhead">
                <div className="rname">
                  {renameG&&canEdit&&scope!=='all'&&scope!=='none'
                    ?<input autoFocus defaultValue={scopeName}
                      onKeyDown={e=>{if(e.key==='Enter'){const v=e.target.value.trim();
                          if(v)setGroups(gs=>gs.map(g=>g.id===scope?{...g,en:v,ru:v}:g));setRenameG(false);}
                        else if(e.key==='Escape')setRenameG(false);}}
                      onBlur={e=>{const v=e.target.value.trim();
                        if(v)setGroups(gs=>gs.map(g=>g.id===scope?{...g,en:v,ru:v}:g));setRenameG(false);}}/>
                    :<span className="n" onDoubleClick={()=>{if(canEdit&&scope!=='all'&&scope!=='none')setRenameG(true);}}>{scopeName}</span>}
                  <span className="c">{t.cams(scoped.length)}</span>
                </div>
                <span className="rspacer"></span>
                <button className="rb">▤ {t.live}</button>
                {canEdit&&scope!=='all'&&scope!=='none'&&(armDel
                  ?<><span className="rb q">{counts[scope]?t.delQ(counts[scope],scopeName):t.delQ0(scopeName)}</span>
                     <button className="rb yes" onClick={()=>{setCams(cs=>cs.map(c=>c.group===scope?{...c,group:null}:c));
                       setGroups(gs=>gs.filter(g=>g.id!==scope));setScope('all');setArmDel(false);}}>✓</button>
                     <button className="rb" onClick={()=>setArmDel(false)}>✕</button></>
                  :<button className="rb danger" onClick={()=>setArmDel(true)}>{t.del}</button>)}
              </div>
              {tw.groupPane==='bar'&&<GroupBar/>}
              {!canEdit&&<div className="rohint">⃠ {t.ro}</div>}
              <div className="fbar">
                <div className="fs"><span className="gl">⌕</span>
                  <input value={cq} onChange={e=>setCq(e.target.value)} placeholder={t.csearch}/>
                </div>
                <button className={'fb2'+(face==='all'?' on':'')} onClick={()=>setFace('all')}>{t.allf}<span className="c">{scoped.length}</span></button>
                <button className={'fb2'+(face==='unnamed'?' on':'')} onClick={()=>setFace('unnamed')}>{t.unnamed}<span className="c">{unnamedN}</span></button>
                <button className={'fb2 warn'+(face==='faults'?' on':'')} onClick={()=>setFace('faults')}>{t.faults}<span className="c">{faultN}</span></button>
                <span className="fspacer"></span>
                {notRecN>0&&<span className="fstat warn"><b>{notRecN}</b> {t.notRecording}</span>}
                {unknownN>0&&<span className="fstat"><b>{unknownN}</b> {t.unknownN}</span>}
                <span className="fstat">{t.ofN(list.length,scoped.length)}</span>
              </div>
              <div className="scroll" ref={scrollRef}>
                {list.length===0&&<div className="empty">
                  <span>{cq?t.nores(cq):face==='faults'?t.nofault:face==='unnamed'?t.nounnamed:t.empty(scopeName)}</span>
                  {(cq||face!=='all')?<button className="cb2" onClick={()=>{setCq('');setFace('all');}}>{t.clear}</button>
                    :<span style={{fontSize:11}}>{t.emptyHint}</span>}
                </div>}
                <div className="wallw" style={{gridTemplateColumns:'repeat('+cols+',minmax(0,1fr))',gridAutoRows:cellH+'px'}}>
                  {list.map(c=><Tile key={c.oct} c={c} t={t} groups={groups} sel={sel.includes(c.oct)}
                    big={big}
                    editing={editing===c.oct} saved={!!saved[c.oct]} canEdit={canEdit} thumbs={tw.thumbs}
                    dragging={dragging&&sel.includes(c.oct)}
                    onSel={onSel} onEdit={setEditing} onCommit={commit} onCancel={()=>setEditing(null)}
                    onChip={(oct,e)=>setChip(placeChip(oct,e,groups.length))}
                    onDragStart={e=>startDrag(c.oct,e)}/>)}
                </div>
                {sel.length>0&&canEdit&&<div className="selbar">
                  <span className="lb">{t.pick(sel.length)}</span>
                  <span className="mv">{t.moveTo}</span>
                  {groups.map(g=><button key={g.id} onClick={()=>{move(sel,g.id);}}>{g.en}</button>)}
                  <button onClick={()=>move(sel,null)}>{t.ungrouped}</button>
                  <span className="sp"></span>
                  <button className="x" onClick={()=>setSel([])}>✕ {t.clear}</button>
                </div>}
              </div>
            </div>
          </div>
        </div>
      </div>
      {focusC&&<Modal c={focusC} t={t} groups={groups} canEdit={canEdit} thumbs={tw.thumbs}
        idx={fIdx} total={list.length} prevCam={prevCam} nextCam={nextCam}
        frameW={W} frameH={900} editing={editing===focusC.oct}
        onEdit={setEditing} onCommit={commit} onCancel={()=>setEditing(null)}
        onChip={(oct,e)=>setChip(placeChip(oct,e,groups.length))}
        onPrev={()=>step(-1)} onNext={()=>step(1)} onClose={()=>setFocus(null)}/>}
      {chip&&(()=>{const c=cams.find(x=>x.oct===chip.oct);if(!c)return null;
        return <div className="gpop" style={{left:chip.x,top:chip.y,maxHeight:chip.maxH,overflowY:'auto'}} onMouseDown={e=>e.stopPropagation()}>
          {groups.map(g=><button key={g.id} className={c.group===g.id?'on':''} onClick={()=>move([chip.oct],g.id)}>{g.en}<span className="c">{counts[g.id]||0}</span></button>)}
          <button className={c.group?'':'on'} onClick={()=>move([chip.oct],null)}>{t.ungrouped}<span className="c">{counts.none}</span></button>
        </div>;})()}
    </div>
    {pill&&<div className="dragpill" style={{left:pill.x+12,top:pill.y+10}}>{t.pick(pill.n)} →</div>}
    <TweaksPanel>
      <TweakSection label="Layout"/>
      <TweakRadio label="Per row" value={tw.density} options={['4','6']} onChange={v=>setTweak('density',v)}/>
      <TweakRadio label="Group pane" value={tw.groupPane} options={['rows','cards','console','bar']} onChange={v=>setTweak('groupPane',v)}/>
      <TweakRadio label="Thumbnails" value={tw.thumbs} options={['live','off']} onChange={v=>setTweak('thumbs',v)}/>
      <TweakSection label="Situation"/>
      <TweakRadio label="Role" value={tw.role} options={['admin','operator','viewer']} onChange={v=>setTweak('role',v)}/>
      <TweakRadio label="Cameras" value={tw.fleet} options={['39','59','80']} onChange={v=>setTweak('fleet',v)}/>
      <TweakSection label="Review harness"/>
      <TweakRadio label="Language" value={tw.lang} options={['EN','RU']} onChange={v=>setTweak('lang',v)}/>
      <TweakRadio label="Window" value={tw.windowW} options={['1440','1200']} onChange={v=>setTweak('windowW',v)}/>
    </TweaksPanel>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
