<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Watchtower — VMS</title>
<meta name="viewport" content="width=1440" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #1a1816;
    --panel: #221f1c;
    --panel-2: #2a2722;
    --line: #34302a;
    --line-2: #443f37;
    --ink: #f0ece4;
    --ink-2: #a89f90;
    --ink-3: #6e6657;
    --accent: #e8a13a;       /* amber */
    --accent-dim: #5a3f15;
    --accent-soft: rgba(232,161,58,0.08);
    --warn: #e8a13a;
    --warn-dim: #5a3f15;
    --bad: #d96649;          /* burnt orange/red */
    --bad-dim: #4a2218;
    --good: #8eb96b;         /* olive green for live */
    --good-dim: #2a4015;
    --rec: #d96649;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #0d0c0b; color: var(--ink); font-family: 'Space Grotesk', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  body { font-size: 13px; line-height: 1.4; letter-spacing: -0.005em; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  input, textarea, select { font: inherit; color: inherit; }
  ::selection { background: var(--accent-dim); }

  /* GNOME-ish window chrome */
  .window { width: 1440px; height: 900px; background: var(--bg); display: flex; flex-direction: column; box-shadow: 0 0 0 1px #000; }
  .titlebar { height: 36px; background: #18161400; background: linear-gradient(#252220,#1c1a17); border-bottom: 1px solid #000; display: flex; align-items: center; padding: 0 12px; user-select: none; gap: 12px; }
  .titlebar .title { flex: 1; text-align: left; font-size: 12px; color: var(--ink-2); }
  .titlebar .title b { color: var(--ink); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; font-family: 'JetBrains Mono'; font-size: 11px; }
  .winbtns { display: flex; gap: 8px; align-items: center; }
  .winbtn { width: 14px; height: 14px; border-radius: 50%; background: var(--line-2); display: inline-block; position: relative; }
  .winbtn svg { position: absolute; inset: 0; margin: auto; opacity: 0.5; }
  .titlebar-spacer { width: 70px; }

  .app { flex: 1; display: grid; grid-template-columns: 72px 1fr; min-height: 0; }

  /* nav rail */
  .rail { background: var(--bg); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: stretch; padding: 12px 0; }
  .brand { height: 48px; display: flex; align-items: center; justify-content: center; margin-bottom: 12px; }
  .brand .logo { width: 36px; height: 36px; background: var(--accent); display: flex; align-items: center; justify-content: center; color: #1a1816; font-family: 'JetBrains Mono'; font-weight: 700; font-size: 16px; }
  .nav-item { height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; color: var(--ink-3); position: relative; }
  .nav-item .lbl { font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600; font-family: 'JetBrains Mono'; }
  .nav-item:hover { color: var(--ink-2); background: var(--panel); }
  .nav-item.active { color: var(--accent); background: var(--panel); }
  .nav-item.active::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--accent); }
  .nav-item .badge { position: absolute; top: 8px; right: 12px; min-width: 16px; height: 16px; padding: 0 4px; background: var(--bad); color: #fff; font-size: 10px; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono'; font-weight: 600; }
  .rail .spacer { flex: 1; }

  /* main column */
  .main { display: flex; flex-direction: column; min-height: 0; }

  /* top bar */
  .topbar { height: 64px; background: var(--bg); border-bottom: 1px solid var(--line); display: flex; align-items: center; padding: 0 20px; gap: 16px; }
  .topbar-brand { display: flex; flex-direction: column; padding-right: 18px; border-right: 1px solid var(--line); margin-right: 4px; }
  .topbar-brand .t { font-family: 'JetBrains Mono'; font-size: 10px; letter-spacing: 0.16em; color: var(--ink-3); text-transform: uppercase; }
  .topbar-brand .v { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; margin-top: 2px; }
  .search { flex: 1; max-width: 420px; position: relative; }
  .search-input { width: 100%; height: 38px; background: var(--panel); border: 1px solid var(--line-2); padding: 0 12px 0 38px; color: var(--ink); outline: none; font-size: 13px; }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--ink-3); }
  .search .icon { position: absolute; left: 12px; top: 11px; color: var(--ink-3); pointer-events: none; }
  .search .kbd { position: absolute; right: 8px; top: 9px; font-family: 'JetBrains Mono'; font-size: 10px; color: var(--ink-3); border: 1px solid var(--line-2); padding: 2px 6px; }

  .status-strip { display: flex; align-items: center; gap: 0; border: 1px solid var(--line-2); background: var(--panel); }
  .chip { display: inline-flex; align-items: baseline; gap: 8px; height: 38px; padding: 0 14px; border-right: 1px solid var(--line); font-family: 'JetBrains Mono'; font-size: 11px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.08em; }
  .chip:last-child { border-right: 0; }
  .chip .dot { width: 7px; height: 7px; background: var(--ink-3); align-self: center; }
  .chip.live .dot { background: var(--good); }
  .chip.off .dot { background: var(--bad); }
  .chip.warn .dot { background: var(--warn); }
  .chip.rec .dot { background: var(--bad); animation: pulse 1.6s ease-in-out infinite; }
  .chip b { color: var(--ink); font-weight: 700; font-size: 18px; letter-spacing: -0.02em; font-family: 'Space Grotesk'; }
  .chip:hover { background: var(--panel-2); cursor: pointer; color: var(--ink-2); }
  .chip.active { background: var(--accent-soft); color: var(--accent); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

  .topbar .clock { font-family: 'JetBrains Mono'; font-size: 12px; color: var(--ink-2); padding-left: 16px; border-left: 1px solid var(--line); }
  .topbar .clock b { color: var(--ink); font-weight: 600; }

  .iconbtn { width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; color: var(--ink-2); border: 1px solid transparent; }
  .iconbtn:hover { background: var(--panel); color: var(--ink); border-color: var(--line-2); }
  .iconbtn.with-badge { position: relative; }
  .iconbtn .ndot { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; background: var(--bad); border: 2px solid var(--bg); }
  .avatar { width: 34px; height: 34px; background: var(--accent); color: var(--bg); display: inline-flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono'; font-size: 12px; font-weight: 700; cursor: pointer; }

  /* sub header */
  .subheader { min-height: 56px; padding: 12px 20px; background: var(--bg); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .selector-btn { display: inline-flex; align-items: center; gap: 12px; height: 38px; padding: 0 14px; border: 1px solid var(--line-2); background: var(--panel); color: var(--ink); font-size: 13px; }
  .selector-btn:hover { border-color: var(--accent); }
  .selector-btn .meta { color: var(--ink-3); font-family: 'JetBrains Mono'; font-size: 11px; }
  .selector-btn b { font-weight: 600; letter-spacing: -0.005em; }

  .seg { display: inline-flex; border: 1px solid var(--line-2); overflow: hidden; height: 38px; background: var(--panel); }
  .seg button { width: 38px; font-family: 'JetBrains Mono'; font-size: 12px; color: var(--ink-2); border-right: 1px solid var(--line); font-weight: 600; }
  .seg button:last-child { border-right: 0; }
  .seg button.active { background: var(--accent); color: var(--bg); }
  .seg button:hover:not(.active) { color: var(--ink); background: var(--panel-2); }

  .filter-pill { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border: 1px solid var(--line-2); background: var(--panel); color: var(--ink-2); font-size: 12px; font-weight: 500; }
  .filter-pill:hover { color: var(--ink); border-color: var(--ink-3); }
  .filter-pill.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .filter-pill .x { color: var(--ink-3); font-family: 'JetBrains Mono'; }

  .right { margin-left: auto; display: flex; align-items: center; gap: 8px; }

  /* grid area */
  .gridwrap { flex: 1; background: var(--bg); padding: 14px 20px; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
  /* dual-pane: live grid + ops sidebar */
  .live-with-ops { display: grid; grid-template-columns: 1fr 320px; flex: 1; min-height: 0; gap: 0; }
  .live-with-ops .gridwrap { padding-right: 0; }
  .ops-sidebar { background: var(--bg); border-left: 1px solid var(--line); display: flex; flex-direction: column; overflow: hidden; }
  .ops-h { padding: 14px 16px 8px; display: flex; align-items: center; justify-content: space-between; }
  .ops-h .t { font-family: 'JetBrains Mono'; font-size: 10px; letter-spacing: 0.16em; color: var(--ink-3); text-transform: uppercase; font-weight: 600; }
  .ops-h .a { font-size: 11px; color: var(--accent); cursor: pointer; }
  .ops-section { border-top: 1px solid var(--line); padding: 12px 16px; }
  .ops-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border: 1px solid var(--line); }
  .ops-stat { background: var(--bg); padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
  .ops-stat .lbl { font-family: 'JetBrains Mono'; font-size: 10px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.1em; }
  .ops-stat .v { font-family: 'Space Grotesk'; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; color: var(--ink); }
  .ops-stat.bad .v { color: var(--bad); }
  .ops-stat.warn .v { color: var(--warn); }
  .ops-stat.good .v { color: var(--good); }
  .ops-event { padding: 10px 0; border-top: 1px solid var(--line); display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
  .ops-event:first-child { border-top: 0; }
  .ops-event:hover { background: var(--panel); margin: 0 -16px; padding: 10px 16px; }
  .ops-event .ico { width: 22px; height: 22px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .ops-event .info { flex: 1; min-width: 0; }
  .ops-event .t { font-size: 12px; color: var(--ink); font-weight: 500; }
  .ops-event .s { font-family: 'JetBrains Mono'; font-size: 10px; color: var(--ink-3); margin-top: 3px; }
  .ops-event .time { font-family: 'JetBrains Mono'; font-size: 10px; color: var(--ink-3); }
  .ops-event.new .ico { color: var(--bad); }
  .ops-event.warn-ev .ico { color: var(--warn); }
  .ops-event.ack .t { color: var(--ink-2); }
  .grid { flex: 1; display: grid; gap: 0; min-height: 0; background: var(--line-2); border: 1px solid var(--line-2); }
  .grid .tile { border: 0; outline: 1px solid var(--line-2); outline-offset: -1px; }

  /* layout segmented control — visual layout chips */
  .layout-seg { display: inline-flex; border: 1px solid var(--line-2); background: var(--panel); height: 38px; overflow: hidden; }
  .layout-seg button { display: inline-flex; align-items: center; gap: 7px; padding: 0 12px; color: var(--ink-2); border-right: 1px solid var(--line); font-size: 12px; font-family: 'JetBrains Mono'; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
  .layout-seg button:last-child { border-right: 0; }
  .layout-seg button:hover:not(.active) { color: var(--ink); background: var(--panel-2); }
  .layout-seg button.active { background: var(--accent); color: var(--bg); }
  .layout-seg button svg { flex-shrink: 0; }
  .layout-seg button.active svg rect { stroke: var(--bg); fill: var(--bg); }
  .layout-seg button.more { color: var(--ink-2); border-left: 1px solid var(--line-2); padding-left: 14px; }
  .layout-seg button.more svg rect { fill: currentColor; opacity: 0.7; stroke: none; }

  .sep-v { width: 1px; height: 26px; background: var(--line-2); margin: 0 4px; align-self: center; }

  /* layout picker popover */
  .layout-menu-scrim { position: absolute; inset: 0; background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center; z-index: 60; }
  .layout-menu { width: 480px; background: var(--panel); border: 1px solid var(--accent); box-shadow: 0 24px 60px rgba(0,0,0,0.6); }
  .lm-h { padding: 16px 22px; border-bottom: 1px solid var(--line); font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
  .lm-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); padding: 1px; }
  .lm-grid button { padding: 18px 12px; display: flex; flex-direction: column; align-items: center; gap: 10px; background: var(--bg); color: var(--ink-2); font-size: 11px; font-family: 'JetBrains Mono'; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }
  .lm-grid button:hover { background: var(--panel-2); color: var(--accent); }
  .lm-grid button:hover svg rect { stroke: var(--accent); }
  .lm-grid button svg rect { stroke: var(--ink-3); }
  .lm-f { padding: 12px 22px; border-top: 1px solid var(--line); background: var(--bg); display: flex; justify-content: flex-end; }
  .grid.g1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
  .grid.g4 { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr); }
  .grid.g9 { grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); }
  .grid.g16 { grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); }

  /* camera tile */
  .tile { position: relative; background: #0a0908; overflow: hidden; border: 1px solid var(--line); display: flex; flex-direction: column; cursor: pointer; }
  .tile:hover { border-color: var(--accent); }
  .tile .vid { position: absolute; inset: 0; }
  .tile .hdr { position: absolute; top: 0; left: 0; right: 0; padding: 6px 8px; display: flex; justify-content: space-between; align-items: flex-start; background: linear-gradient(180deg, rgba(0,0,0,0.7), transparent); pointer-events: none; }
  .tile .ftr { position: absolute; bottom: 0; left: 0; right: 0; padding: 6px 8px; display: flex; justify-content: space-between; align-items: flex-end; background: linear-gradient(0deg, rgba(0,0,0,0.7), transparent); }
  .tile .name { font-size: 11px; font-weight: 600; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
  .tile .meta { font-family: 'JetBrains Mono'; font-size: 10px; color: rgba(255,255,255,0.6); letter-spacing: 0.04em; }
  .tile .badges { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  .badge { display: inline-flex; align-items: center; gap: 4px; height: 18px; padding: 0 6px; font-family: 'JetBrains Mono'; font-size: 9px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
  .badge.live { background: var(--good-dim); color: var(--good); }
  .badge.live .d { width: 6px; height: 6px; background: var(--good); box-shadow: 0 0 6px var(--good); }
  .badge.off { background: var(--bad-dim); color: var(--bad); }
  .badge.off .d { width: 6px; height: 6px; background: var(--bad); }
  .badge.deg { background: var(--accent-dim); color: var(--accent); }
  .badge.deg .d { width: 6px; height: 6px; background: var(--accent); }
  .badge.rec { background: var(--bad-dim); color: var(--bad); }
  .badge.rec .d { width: 6px; height: 6px; background: var(--bad); animation: pulse 1.6s infinite; }
  .badge.norec { background: var(--accent-dim); color: var(--accent); }
  .badge.norec .d { width: 7px; height: 7px; border: 1.5px solid var(--accent); background: transparent; }
  .badge.unk { background: var(--line); color: var(--ink-3); }
  .badge.unk .d { width: 6px; height: 6px; background: var(--ink-3); }

  .tile .actions { position: absolute; top: 50%; right: 8px; transform: translateY(-50%); display: flex; flex-direction: column; gap: 4px; opacity: 0; transition: opacity 0.12s; }
  .tile:hover .actions { opacity: 1; }
  .tile-action { width: 30px; height: 30px; background: rgba(0,0,0,0.85); border: 1px solid var(--line-2); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; }
  .tile-action:hover { background: var(--accent); border-color: var(--accent); color: var(--bg); }

  .tile.offline { border-color: var(--bad); }
  .tile.offline::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--bad); z-index: 2; }
  .tile.not-recording { border-color: var(--accent); }
  .tile.not-recording::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--accent); z-index: 2; }
  .tile.degraded { border-color: var(--accent); }
  .tile.degraded::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--accent); z-index: 2; }

  .tile-issue { position: absolute; left: 8px; bottom: 34px; font-family: 'JetBrains Mono'; font-size: 10px; color: var(--ink); background: rgba(0,0,0,0.9); border-left: 3px solid var(--accent); padding: 5px 10px; display: flex; align-items: center; gap: 8px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
  .tile-issue a { color: var(--accent); text-decoration: underline; cursor: pointer; }

  .offline-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--ink-2); }
  .offline-center .big { font-family: 'IBM Plex Mono'; font-size: 13px; color: var(--bad); letter-spacing: 0.1em; }
  .offline-center .sub { font-family: 'IBM Plex Mono'; font-size: 10px; color: var(--ink-3); }

  /* "fake video" placeholder */
  .placeholder-vid { position: absolute; inset: 0; background-color: #14181d; background-image:
    repeating-linear-gradient(45deg, rgba(255,255,255,0.012) 0 1px, transparent 1px 6px),
    radial-gradient(ellipse at 30% 30%, rgba(127,220,198,0.04), transparent 60%);
  }
  .placeholder-vid.v1 { background-color: #181612; }
  .placeholder-vid.v2 { background-color: #11151a; }
  .placeholder-vid.v3 { background-color: #0d1318; }
  .placeholder-vid.v4 { background-color: #161219; }
  .placeholder-vid .ts { position: absolute; top: 6px; right: 8px; font-family: 'IBM Plex Mono'; font-size: 10px; color: rgba(255,255,255,0.55); }
  .placeholder-vid .geom { position: absolute; inset: 0; opacity: 0.18; }

  /* page bar */
  .page-bar { display: flex; align-items: center; justify-content: space-between; padding: 0 4px; color: var(--ink-2); font-family: 'JetBrains Mono'; font-size: 11px; }
  .page-bar .nav { display: flex; align-items: center; gap: 6px; }
  .page-bar button { width: 30px; height: 30px; border: 1px solid var(--line-2); display: inline-flex; align-items: center; justify-content: center; color: var(--ink-2); background: var(--bg); }
  .page-bar button:hover { color: var(--accent); border-color: var(--accent); }
  .page-bar button:disabled { opacity: 0.3; cursor: default; }
  .page-bar b { color: var(--ink); font-weight: 700; }

  /* command palette */
  .scrim { position: absolute; inset: 0; background: rgba(0,0,0,0.65); display: flex; align-items: flex-start; justify-content: center; padding-top: 90px; z-index: 50; }
  .palette { width: 680px; background: var(--panel); border: 1px solid var(--accent); box-shadow: 0 24px 60px rgba(0,0,0,0.6); overflow: hidden; }
  .palette-input { width: 100%; height: 56px; background: transparent; border: 0; padding: 0 16px 0 50px; color: var(--ink); font-size: 16px; outline: none; border-bottom: 1px solid var(--line); position: relative; font-family: 'Space Grotesk'; }
  .palette-search-icon { position: absolute; left: 18px; top: 20px; color: var(--accent); }
  .palette-results { max-height: 460px; overflow-y: auto; }
  .palette-group { padding: 10px 16px 4px; font-family: 'JetBrains Mono'; font-size: 10px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.14em; font-weight: 600; }
  .palette-row { display: flex; align-items: center; gap: 12px; padding: 10px 16px; cursor: pointer; border-left: 3px solid transparent; }
  .palette-row:hover, .palette-row.sel { background: var(--panel-2); border-left-color: var(--accent); }
  .palette-row .thumb { width: 36px; height: 26px; background: #000; border: 1px solid var(--line-2); flex-shrink: 0; position: relative; }
  .palette-row .info { flex: 1; min-width: 0; }
  .palette-row .info .t { font-size: 13px; color: var(--ink); font-weight: 500; }
  .palette-row .info .s { font-size: 11px; color: var(--ink-3); font-family: 'JetBrains Mono'; }
  .palette-row .badges-mini { display: flex; gap: 4px; }
  .palette-foot { display: flex; gap: 14px; padding: 8px 14px; border-top: 1px solid var(--line); font-family: 'IBM Plex Mono'; font-size: 10px; color: var(--ink-3); }

// Build cameras with deterministic status mix
function buildCameras() {
  return NAMES.map((n, i) => {
    let live = 'live', rec = 'recording';
    if (i === 6) { live = 'offline'; rec = 'unknown'; }
    if (i === 10) { live = 'live'; rec = 'not-recording'; }
    if (i === 14) { live = 'degraded'; rec = 'recording'; }
    if (i === 20) { live = 'live'; rec = 'gap'; }
    return {
      id: n[0],
      name: n[1],
      group: n[2],
      live,
      recording: rec,
      pattern: CAM_PATTERNS[i % 4],
      hasAudio: i % 4 === 0,
      favorite: i === 0 || i === 2 || i === 16,
      ts: '17:42:'+String(8 + (i*7) % 50).padStart(2,'0'),
      lastSeen: '14:22',
    };
  });
}

function liveBadge(state) {
  if (state === 'live') return <span className="badge live"><span className="d"/>LIVE</span>;
  if (state === 'offline') return <span className="badge off"><span className="d"/>OFFLINE</span>;
  if (state === 'degraded') return <span className="badge deg"><span className="d"/>DEGRADED</span>;
  return <span className="badge unk"><span className="d"/>UNKNOWN</span>;
}
function recBadge(state) {
  if (state === 'recording') return <span className="badge rec"><span className="d"/>REC</span>;
  if (state === 'not-recording') return <span className="badge norec"><span className="d"/>NOT REC</span>;
  if (state === 'unknown') return <span className="badge unk"><span className="d"/>REC ?</span>;
  if (state === 'gap') return <span className="badge norec"><span className="d"/>GAP</span>;
  return null;
}

function CameraTile({ cam, size = 'md', onOpen, onPlay }) {
  const isOff = cam.live === 'offline';
  const isNotRec = cam.recording === 'not-recording';
  const isDeg = cam.live === 'degraded';
  const cls = ['tile'];
  if (isOff) cls.push('offline');
  if (isNotRec) cls.push('not-recording');
  if (isDeg) cls.push('degraded');

  const geom = cam.group.includes('park') ? 'parking' : cam.group.includes('lob') ? 'lobby' : 'corridor';

  return (
    <div className={cls.join(' ')} onClick={onOpen}>
      <div className="vid">
        {isOff ? (
          <div style={{position:'absolute',inset:0,background:'#0a0d11'}}>
            <div className="offline-center">
              <div style={{color: 'var(--bad)'}}>{I.off(28)}</div>
              <div className="big">NO SIGNAL</div>
              <div className="sub">last seen {cam.lastSeen}</div>
            </div>
          </div>
        ) : (
          <PlaceholderVid pattern={cam.pattern} ts={cam.ts} geom={geom} label={cam.id} />
        )}
      </div>
      <div className="hdr">
        <div>
          <div className="name">{cam.name}</div>
          <div className="meta">{cam.id}</div>
        </div>
        <div className="badges">
          {liveBadge(cam.live)}
          {recBadge(cam.recording)}
        </div>
      </div>
      {isNotRec && (
        <div className="tile-issue">
          <span style={{color:'var(--warn)'}}>⚠</span>
          <span>Live, no recording</span>
          <a onClick={(e)=>{e.stopPropagation();}}>View issue ›</a>
        </div>
      )}
      {isDeg && (
        <div className="tile-issue" style={{borderColor:'var(--warn-dim)'}}>
          <span style={{color:'var(--warn)'}}>~</span>
          <span>Stream degraded — reduced bitrate</span>
        </div>
      )}
      <div className="actions" onClick={e=>e.stopPropagation()}>
        <button className="tile-action" title="Open playback" onClick={onPlay}>{I.clip(14)}</button>
        <button className="tile-action" title="Snapshot">{I.shot(14)}</button>
        <button className="tile-action" title="Bookmark">{I.bookmark(14)}</button>
        <button className="tile-action" title="Favorite">{I.star(14)}</button>
        <button className="tile-action" title="Open in new tab">{I.newtab(14)}</button>
      </div>
    </div>
  );
}

}

        <div className="kv"><span className="k">Camera</span><span className="v">Lobby Main (A-101)</span></div>

        <select className="speed-sel" style={{width:'100%',height:32,padding:'0 10px'}} value={purpose} onChange={e=>setPurpose(e.target.value)}>
          <option>Incident review</option>
          <option>Police request</option>
          <option>Customer complaint</option>
          <option>Internal investigation</option>
          <option>Maintenance check</option>

        <div style={{padding:10,background:'rgba(240,181,74,0.08)',border:'1px solid var(--warn-dim)',marginTop:14,fontSize:12,color:'var(--warn)',lineHeight:1.5,borderRadius:3}}>
          <b>⚠ Selection spans a recording gap</b> between 14:30:48 – 14:31:09 (21s). The exported clip will contain a freeze frame for this period.

        <div className="modal-h"><div className="t">Confirm export</div><button className="iconbtn" onClick={onClose}>{I.x(14)}</button></div>
        <div className="modal-b">
          <p style={{margin:'0 0 12px',fontSize:13,lineHeight:1.6}}>You are about to export footage from <b>Lobby Main (A-101)</b> for <b>14:28:00 – 14:35:24</b> (<b>7m 24s</b>) for purpose <b>Incident review</b>.</p>
          <div style={{padding:10,background:'var(--bg)',borderRadius:3,fontSize:12,color:'var(--ink-2)',lineHeight:1.6}}>

function EventDetailDrawer({ event, onClose }) {
  if (!event) return null;
  return (
    <div className="drawer" style={{width:380}}>
      <div className="drawer-h">
        <div><div className="t">{event.desc}</div><div className="s">{event.type.toUpperCase()} · {event.time}</div></div>
        <button className="iconbtn" onClick={onClose}>{I.x(14)}</button>
      </div>
      <div className="drawer-body">
        <div style={{aspectRatio:'16/9',background:'#000',marginBottom:14,position:'relative'}}>
          <PlaceholderVid pattern="v3" ts={event.time} geom="parking" label={event.cam}/>
          <div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',justifyContent:'center'}}>
            <div style={{width:44,height:44,borderRadius:'50%',background:'rgba(11,14,18,0.85)',border:'1px solid var(--line-2)',display:'flex',alignItems:'center',justifyContent:'center',color:'#fff'}}>{I.play(18)}</div>
          </div>
        </div>
        <div className="kv"><span className="k">Camera</span><span className="v">{event.camName}</span></div>
        <div className="kv"><span className="k">Group</span><span className="v">{event.group}</span></div>
        <div className="kv"><span className="k">Time</span><span className="v">{event.time}</span></div>
        <div className="kv"><span className="k">Status</span><span className="v" style={{color: event.ack?'var(--accent)':'var(--bad)'}}>{event.ack?'ACKNOWLEDGED':'NEW'}</span></div>
        {event.ack && <>
          <div className="kv"><span className="k">Acknowledged by</span><span className="v">{event.ackBy}</span></div>
          <div className="kv"><span className="k">Acknowledged at</span><span className="v">{event.ackTime}</span></div>
        </>}
        <div style={{marginTop:14,display:'flex',gap:6,flexWrap:'wrap'}}>
          <button className="btn primary">{I.clip(13)} Open playback (–15s)</button>
          <button className="btn">{I.bookmark(13)} Bookmark</button>
          <button className="btn">{I.download(13)} Export clip</button>
          {!event.ack && <button className="btn">{I.check(13)} Acknowledge</button>}
        </div>
      </div>
    </div>
  );
}

function Toasts({ onPlayback }) {
  return (
    <div className="toasts">
      <div className="toast grouped">
        <div className="row">
          <span className="t" style={{color:'var(--warn)'}}>⚠ 5 cameras went offline</span>
          <button className="close">{I.x(12)}</button>
        </div>
        <div className="s">Perimeter NW · Perimeter NE · Stair B · Mail Room · F1 Server Room — 17:31</div>
        <div className="actions">
          <button className="primary">View 5 events</button>
          <button>Acknowledge all</button>
        </div>
      </div>
      <div className="toast">
        <div className="row">
          <span className="t">Motion · Parking Gate N</span>
          <button className="close">{I.x(12)}</button>
        </div>
        <div className="s">P-G01 · 17:38:12 · vehicle entering</div>

// ---------------------------- ROOT APP ----------------------------
function App() {
  const [section, setSection] = useState('live');
  const [layout, setLayout] = useState(16);
  const [openMenu, setOpenMenu] = useState(null);
  const [showPalette, setShowPalette] = useState(false);
  const [showSelector, setShowSelector] = useState(false);
  const [showSaveView, setShowSaveView] = useState(false);
  const [showBookmark, setShowBookmark] = useState(false);
  const [showExport, setShowExport] = useState(false);
  const [showConfirm, setShowConfirm] = useState(false);
  const [activeEvent, setActiveEvent] = useState(null);
  const [filter, setFilter] = useState(null);
  const [fullscreen, setFullscreen] = useState(false);
  const [showLogin, setShowLogin] = useState(false);
  const [showToasts, setShowToasts] = useState(true);
  const [focusedCam, setFocusedCam] = useState(null);
  const [view, setView] = useState('grid'); // grid | playback

  // simulate clock
  const [clock, setClock] = useState('17:42:31');
  useEffect(()=>{
    const id = setInterval(()=>{
      const d = new Date();
      setClock(d.toLocaleTimeString('en-GB',{hour12:false}));
    },1000);
    return ()=>clearInterval(id);
  },[]);

  // keyboard shortcuts
  useEffect(()=>{
    const onKey = (e) => {
      if ((e.ctrlKey||e.metaKey) && e.key==='k') { e.preventDefault(); setShowPalette(true); }
      if (e.key === 'Escape') {
        if (showPalette) setShowPalette(false);
        else if (fullscreen) setFullscreen(false);
        else if (showSelector) setShowSelector(false);
      }
      if (e.key === 'f' && section==='live' && !showPalette) setFullscreen(f=>!f);
      if (e.key === '1' && section==='live') setLayout(1);
      if (e.key === '2' && section==='live') setLayout(4);
      if (e.key === '3' && section==='live') setLayout(9);
      if (e.key === '4' && section==='live') setLayout(16);
    };
    window.addEventListener('keydown', onKey);
    return ()=>window.removeEventListener('keydown', onKey);
  },[showPalette, fullscreen, showSelector, section]);

  if (showLogin) {
    return (
      <div className="login-screen">
        <div className="login-side">
          <div className="top">
            <div className="logo">W</div>
            <div className="tag">VMS — Operations</div>
            <h2>Watchtower keeps your sites visible.</h2>
          </div>
          <div className="stats">
            <div className="stat"><div className="v">137</div><div className="l">Cameras<br/>online</div></div>
            <div className="stat"><div className="v" style={{color:'var(--bad)'}}>7</div><div className="l">Active<br/>issues</div></div>
          </div>
        </div>
        <div className="login-form-area">
          <h1>Sign in</h1>
          <div className="sub">Operator console · HQ Campus</div>
          <div className="field"><label>Operator ID</label><input type="text" defaultValue="m.osei"/></div>
          <div className="field"><label>Password</label><input type="password" defaultValue="•••••••••"/></div>
          <button className="btn primary" style={{width:'100%',height:42,justifyContent:'center',marginTop:14,fontSize:13,letterSpacing:'0.06em',textTransform:'uppercase'}} onClick={()=>setShowLogin(false)}>Sign in</button>
          <div style={{marginTop:16,padding:10,background:'var(--bad-dim)',border:'1px solid var(--bad)',color:'var(--bad)',fontSize:12,display:'none'}}>Incorrect operator ID or password.</div>
          <div style={{marginTop:24,fontSize:11,color:'var(--ink-3)',fontFamily:'JetBrains Mono',textTransform:'uppercase',letterSpacing:'0.1em'}}>v 4.2.1 · build 2026.05.18</div>
        </div>
      </div>
    );
  }

  const goPlayback = (cam, mode='playback') => { setFocusedCam(cam); setView('playback'); };
  const goLive = () => { setView('grid'); };

  const cls = ['window'];
  if (fullscreen) cls.push('fullscreen');

  return (
    <div className={cls.join(' ')}>
      <TitleBar />
      <div className="app">
        {!fullscreen && <NavRail section={section} setSection={(s)=>{setSection(s); setView('grid');}} hasAlerts={3}/>}
        <div className="main">
          <TopBar onOpenSearch={()=>setShowPalette(true)} openMenu={openMenu} setOpenMenu={setOpenMenu} activeFilter={filter} setActiveFilter={setFilter}/>
          {section === 'live' && view === 'grid' && (
            <LiveMonitor goPlayback={goPlayback} openPalette={()=>setShowPalette(true)} openSelector={()=>setShowSelector(!showSelector)} openSaveView={()=>setShowSaveView(true)} layout={layout} setLayout={setLayout} fullscreen={fullscreen} setFullscreen={setFullscreen} openExport={()=>setShowExport(true)} openEvent={setActiveEvent}/>
          )}
          {section === 'live' && view === 'playback' && <Playback camera={focusedCam} back={()=>setView('grid')} openExport={()=>setShowExport(true)} goLive={goLive}/>}
          {section === 'groups' && <GroupsScreen goCam={goPlayback}/>}
          {section === 'views' && <SavedViewsScreen goLive={()=>{setSection('live'); setView('grid');}}/>}
          {section === 'clips' && <ClipsScreen/>}
          {section === 'events' && <EventsScreen openEvent={setActiveEvent}/>}
          {section === 'health' && <HealthScreen openCam={(c,m)=>{setFocusedCam(c); setSection('live'); setView(m==='playback'?'playback':'grid');}}/>}
          {section === 'prefs' && <PrefsScreen/>}
        </div>
      </div>

      {showPalette && <CommandPalette onClose={()=>setShowPalette(false)} goCam={(c,m)=>{setFocusedCam(c); setShowPalette(false); setSection('live'); setView(m==='playback'?'playback':'grid');}}/>}
      {showSelector && <GroupSelector onClose={()=>setShowSelector(false)} onPick={()=>setShowSelector(false)}/>}
      {showSaveView && <SaveViewModal onClose={()=>setShowSaveView(false)}/>}
      {showBookmark && <BookmarkModal onClose={()=>setShowBookmark(false)}/>}
      {showExport && !showConfirm && <ExportDrawer onClose={()=>setShowExport(false)} openConfirm={()=>setShowConfirm(true)}/>}
      {showConfirm && <ConfirmModal onClose={()=>setShowConfirm(false)} onConfirm={()=>{setShowConfirm(false); setShowExport(false);}}/>}
      {activeEvent && <EventDetailDrawer event={activeEvent} onClose={()=>setActiveEvent(null)}/>}
      {showToasts && section==='live' && view==='grid' && !fullscreen && <Toasts onPlayback={()=>goPlayback(CAMERAS[16])}/>}

      {fullscreen && (
        <button onClick={()=>setFullscreen(false)} style={{position:'absolute',top:12,right:16,zIndex:30,background:'rgba(11,14,18,0.85)',border:'1px solid var(--line-2)',padding:'6px 10px',color:'var(--ink)',fontSize:11,borderRadius:3,display:'flex',gap:6,alignItems:'center'}}>{I.full(13)} Exit full-screen (Esc)</button>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
