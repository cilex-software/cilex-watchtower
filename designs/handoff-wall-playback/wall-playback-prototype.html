<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wall playback — Roll Call</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1a1816;--panel:#221f1c;--panel2:#2a2722;--panel3:#322e28;--line:#34302a;--line2:#443f37;--ink:#f0ece4;--ink2:#a89f90;--ink3:#6e6657;--accent:#e8a13a;--accentSoft:rgba(232,161,58,.08);--accentDim:#5a3f15;--bad:#d96649;--good:#8eb96b;--info:#6f9bc4;--violet:#9a7bd0;--box:#121110;--trough:#16140f;--ready:#3f5a2a;--warm:#4a4327}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0c0b;font-family:'Space Grotesk',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;padding:14px 18px 22px;overflow-x:auto}
.wrap{width:max-content;margin:0 auto}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:left}
input{font:inherit;color:inherit;background:none;border:none;outline:none}
a{color:var(--accent)}a:hover{color:var(--ink)}
::-webkit-scrollbar{width:3px;height:3px}::-webkit-scrollbar-thumb{background:var(--line2)}::-webkit-scrollbar-track{background:transparent}
.vbar{display:flex;align-items:center;gap:10px;padding:0 2px 9px}
.vsw{display:flex;border:1px solid var(--line2)}
.vsw a{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--ink3);text-decoration:none;padding:3px 8px;border-right:1px solid var(--line2)}
.vsw a:last-child{border-right:0}
.vsw a:hover{background:var(--panel2);color:var(--ink)}
.vsw a.on{background:var(--accent);color:#241a08;font-weight:700}
.vnote{font-size:11px;color:var(--ink3)}
.vnote b{color:var(--ink2);font-weight:500}
.frame{background:var(--bg);border:1px solid var(--line2);height:900px;display:flex;flex-direction:column;overflow:hidden;position:relative;flex:none;transition:width .18s ease}
/* chrome */
.titlebar{height:24px;background:#141312;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;padding:0 9px;flex:none}
.titlebar .tt{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:1.4px;color:var(--ink3)}
.titlebar .tt b{color:var(--ink2);font-weight:400}
.titlebar .dots{margin-left:auto;display:flex;gap:6px}
.titlebar .dots i{width:8px;height:8px;border-radius:50%;display:block}
.topbar{height:52px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:stretch;flex:none}
.tcell{display:flex;align-items:center;padding:0 12px;border-right:1px solid var(--line);flex:none;gap:9px}
.tcell.grow{flex:1;min-width:0}
.brand .b1{font-family:'JetBrains Mono',monospace;font-size:7.5px;letter-spacing:1.5px;color:var(--ink3)}
.brand .b2{font-size:14px;font-weight:600;letter-spacing:-.2px;line-height:1.1}
.brand .b2 em{font-family:'JetBrains Mono',monospace;font-size:9px;font-style:normal;color:var(--ink3);margin-left:5px}
.searchc{color:var(--ink3);font-size:11px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kbd{font-family:'JetBrains Mono',monospace;font-size:8px;border:1px solid var(--line);padding:1px 4px;color:var(--ink3);letter-spacing:.6px;flex:none}
.pilb{display:flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink2);letter-spacing:.7px;white-space:nowrap;height:26px;padding:0 9px}
.pilb i{width:6px;height:6px;flex:none;display:block}
.pilb:hover{background:var(--panel2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
.pilb .go{font-size:9px;color:var(--ink3)}
.pilb:hover .go{color:var(--accent)}
.chk{display:flex;align-items:center;gap:7px;height:26px;padding:0 11px;font-size:11.5px;color:var(--ink2);box-shadow:inset 0 0 0 1px var(--line2);white-space:nowrap}
.chk:hover{background:var(--panel2);color:var(--ink)}
.pill{display:flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink2);letter-spacing:.7px;white-space:nowrap}
/* body */
.body{flex:1;display:flex;min-height:0}
.rail{width:72px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;flex:none}
.railitem{height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:1.1px;color:var(--ink3);border-bottom:1px solid var(--line);position:relative}
.railitem .g{width:16px;height:16px;border:1px solid currentColor}
.railitem.on{color:var(--accent);background:var(--accentSoft)}
.railitem .bd{position:absolute;top:8px;right:12px;background:var(--bad);color:#fff;font-size:7.5px;padding:0 3px;font-weight:700}
.mid{flex:1;min-width:0;display:flex;flex-direction:column}
.stagerow{flex:1;display:flex;min-height:0}
/* GRID */
.stage{flex:1;min-width:0;background:var(--box);position:relative;overflow:hidden}
.grid{position:absolute;display:grid;gap:0}
.cell{position:relative;overflow:hidden;background:#0f0e0d;padding:0}
.cell::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:7;box-shadow:inset 0 0 0 1px rgba(0,0,0,.55)}
.cell.lit::after{box-shadow:inset 0 0 0 1px rgba(0,0,0,.55)}
.cell.mot::after{box-shadow:inset 0 0 0 2px var(--accent)}
.cell.hi::after{box-shadow:inset 0 0 0 2px var(--ink)}
.cell.drop::after{box-shadow:inset 0 0 0 2px var(--accent)}
.cell.drag{opacity:.45}
.im{position:absolute;inset:0;overflow:hidden}
.im i{position:absolute;display:block}
/* cell overlays */
.coct{position:absolute;left:0;top:0;z-index:5;display:flex;align-items:center;gap:6px;padding:4px 7px;background:linear-gradient(180deg,rgba(0,0,0,.62),rgba(0,0,0,0));width:100%;line-height:1}
.coct b{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.9)}
.coct span{font-size:9.5px;color:rgba(255,255,255,.62);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.cell.dorm .coct{background:none}
.cell.dorm .coct b{color:var(--ink2);text-shadow:none}
.cell.dorm .coct span{color:var(--ink3)}
.cmot{position:absolute;right:6px;top:5px;z-index:6;font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:1.1px;background:var(--accent);color:#241a08;padding:1px 4px;font-weight:700}
.cchip{position:absolute;left:6px;bottom:5px;z-index:6;font-family:'JetBrains Mono',monospace;font-size:9px;color:#fff;background:#cc16140f;background:rgba(22,20,15,.8);padding:1px 5px}
.cgrip{position:absolute;right:5px;bottom:5px;z-index:6;display:none;gap:4px}
.cell:hover .cgrip{display:flex}
.cgrip button{width:20px;height:20px;display:grid;place-items:center;background:rgba(13,12,11,.82);color:rgba(255,255,255,.72);font-size:10px;box-shadow:inset 0 0 0 1px var(--line2)}
.cgrip button:hover{background:var(--accent);color:#241a08}
/* dormant cell — the wall's best navigation control */
.dorm{background:repeating-linear-gradient(135deg,#131211 0 6px,#171513 6px 12px)}
.dnone{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;z-index:4;padding:6px;text-align:center}
.dnone .k{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:1.4px;color:var(--ink3)}
.dnone .j{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.4px;color:var(--accent);box-shadow:inset 0 0 0 1px var(--accentDim);background:var(--accentSoft);padding:3px 7px;white-space:nowrap}
.dnone .j:hover{background:var(--accent);color:#241a08;box-shadow:inset 0 0 0 1px var(--accent)}
.dnone .n{font-family:'JetBrains Mono',monospace;font-size:8.5px;color:var(--ink3)}
/* empty slot */
.empt{background:#100f0e;display:flex;align-items:center;justify-content:center}
.empt button{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1.2px;color:var(--ink3);box-shadow:inset 0 0 0 1px var(--line);padding:5px 9px}
.empt button:hover{color:var(--accent);box-shadow:inset 0 0 0 1px var(--accentDim);background:var(--accentSoft)}
/* the one authoritative clock */
.wclock{position:absolute;z-index:9;display:flex;align-items:baseline;gap:9px;padding:6px 11px;background:rgba(13,12,11,.82);box-shadow:inset 0 0 0 1px var(--line2);line-height:1}
.wclock .d{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:600;color:rgba(255,255,255,.62);white-space:nowrap}
.wclock .t{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:600;color:#fff;letter-spacing:.4px}
.wclock .t .ms{color:var(--accent)}
.wclock .sy{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:1.3px;color:var(--good);box-shadow:inset 0 0 0 1px rgba(142,185,107,.45);padding:2px 5px;white-space:nowrap}
.wclock .sy:hover{background:rgba(142,185,107,.14)}
.wbanner{position:absolute;inset:0;z-index:12;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(13,12,11,.86);text-align:center;padding:26px}
.wbanner .bi{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:1.6px;padding:3px 8px}
.wbanner .bt{font-size:15px;max-width:520px;line-height:1.5}
.wbanner .bs{font-size:12px;color:var(--ink3);max-width:460px;line-height:1.5}
.wbanner button{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.9px;color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);padding:6px 12px}
.wbanner button:hover{background:var(--accentSoft)}
/* ASIDE */
.aclock{padding:8px 11px 9px;border-bottom:1px solid var(--line2);flex:none;display:flex;flex-direction:column;gap:3px;line-height:1}
.aclock .d{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;color:rgba(240,236,228,.62);white-space:nowrap}
.aclock .t{font-family:'JetBrains Mono',monospace;font-size:21px;font-weight:600;color:var(--ink);letter-spacing:.3px}
.aclock .t .ms{color:var(--accent)}
.aclock .sy{align-self:flex-start;margin-top:3px;font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:1.3px;color:var(--good);box-shadow:inset 0 0 0 1px rgba(142,185,107,.45);padding:2px 5px}
.aclock .sy:hover{background:rgba(142,185,107,.14)}
/* tier 1 — the archive ribbon, sharing the scrubber's axis */
.rib{height:42px;display:flex;align-items:stretch;flex:none;background:var(--bg);border-top:1px solid var(--line2);box-shadow:inset 0 -1px 0 var(--line)}
.riblbl{width:132px;flex:none;padding:6px 10px;display:flex;flex-direction:column;gap:3px;justify-content:center;box-shadow:inset -1px 0 0 var(--line);overflow:hidden}
.riblbl .k{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:1.4px;color:var(--ink3);display:flex;align-items:baseline;gap:6px}
.riblbl .k em{font-style:normal;letter-spacing:1.2px;margin-left:auto;color:var(--ink2)}
.riblbl .v{font-family:'JetBrains Mono',monospace;font-size:8.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ribtrack{flex:1;min-width:0;display:flex;align-items:stretch;position:relative}
.rday{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;padding:4px 0 3px;flex:none;box-shadow:inset -1px 0 0 rgba(52,48,42,.55)}
.rday .wd{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:1.2px;color:var(--ink3);line-height:1}
.rday .dn{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink2);line-height:1}
.rday .dens{width:100%;height:4px;padding:0 3px;display:flex;align-items:flex-end}
.rday .dens i{display:block;width:100%;background:var(--ready);min-height:1px}
.rday.wkB{background:rgba(240,236,228,.028)}
.rday.none{cursor:default}
.rday.none .dn{color:rgba(110,102,87,.42)}
.rday.none .wd{color:rgba(110,102,87,.32)}
.rday.has:hover{background:var(--panel2)}
.rday.has:hover .dn{color:var(--ink)}
.rday.today{box-shadow:inset -1px 0 0 rgba(52,48,42,.55),inset 0 0 0 1px var(--ink3)}
.rday.sel{background:var(--accentSoft);box-shadow:inset -1px 0 0 rgba(52,48,42,.55),inset 0 -2px 0 var(--accent)}
.rday.sel .dn{color:var(--accent);font-weight:600}
.rday.sel .wd{color:var(--accent)}
.wdiv{position:absolute;top:0;bottom:0;width:1px;background:rgba(68,63,55,.55);pointer-events:none}
.mdiv{position:absolute;top:0;bottom:0;width:1px;background:var(--line2);pointer-events:none}
.mlbl{position:absolute;top:2px;font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:1.3px;color:var(--ink3);padding-left:3px;pointer-events:none}
.ribwin{position:absolute;top:0;bottom:0;background:rgba(232,161,58,.16);box-shadow:inset 0 0 0 1px var(--accent);pointer-events:none;z-index:2}
.aside{width:296px;flex:none;background:var(--bg);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.ahd{padding:9px 11px 8px;border-bottom:1px solid var(--line);flex:none}
.ahd .h1{font-size:15px;font-weight:600;letter-spacing:-.2px}
.ahd .h2{display:flex;align-items:center;gap:7px;margin-top:3px}
.ahd .h2 span{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--ink3)}
.ahd .h2 button{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1.1px;color:var(--ink2);box-shadow:inset 0 0 0 1px var(--line2);padding:4px 7px;flex:none}
.ahd .h2 button:hover{color:var(--ink);background:var(--panel2)}
.arow{display:flex;align-items:stretch;border-bottom:1px solid var(--line);flex:none}
.arow .k{width:62px;flex:none;display:flex;align-items:center;padding:0 11px;font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:1.3px;color:var(--ink3);border-right:1px solid var(--line)}
.gsel{flex:1;min-width:0;height:30px;display:flex;align-items:center;gap:8px;padding:0 10px;font-size:11.5px;color:var(--ink);position:relative}
.gsel:hover{background:var(--panel2)}
.gsel .cv{margin-left:auto;font-size:8px;color:var(--ink3)}
.gpop{position:absolute;left:0;right:0;top:100%;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line2);z-index:40}
.gpop button{width:100%;height:28px;display:flex;align-items:center;gap:8px;padding:0 10px;font-size:11.5px;color:var(--ink2)}
.gpop button:hover{background:var(--panel2);color:var(--ink)}
.gpop button.on{color:var(--accent)}
.gpop button[disabled]{color:rgba(110,102,87,.5);cursor:default}
.gpop button[disabled]:hover{background:none}
.gpop .n{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink3)}
.wstate{padding:8px 11px;border-bottom:1px solid var(--line);flex:none;display:flex;flex-direction:column;gap:4px}
.wstate .l1{display:flex;align-items:baseline;gap:7px}
.wstate .md{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:1.3px;padding:2px 5px;flex:none}
.wstate .md.roll{color:var(--info);box-shadow:inset 0 0 0 1px rgba(111,155,196,.45)}
.wstate .md.cal{color:var(--accent);box-shadow:inset 0 0 0 1px var(--accentDim);background:var(--accentSoft)}
.wstate .rng{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--ink2)}
.wstate .sub{font-size:10px;color:var(--ink3);line-height:1.35}
.cal{padding:8px 11px 9px;border-bottom:1px solid var(--line);flex:none}
.cal .ch{display:flex;align-items:baseline;gap:7px;margin-bottom:5px}
.cal .ch .k{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:1.3px;color:var(--ink3)}
.cal .ch .v{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:8.5px;color:var(--ink3)}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.calw{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:1.2px;color:var(--ink3);text-align:center;padding-bottom:3px}
.cald{height:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--ink2);padding:0}
.cald.out{color:rgba(110,102,87,.26);cursor:default}
.cald.none{color:rgba(110,102,87,.55);cursor:default}
.cald.has:hover{background:var(--panel2);color:var(--ink)}
.cald.today{box-shadow:inset 0 0 0 1px var(--ink3)}
.cald.sel{background:var(--accent);color:#241a08;font-weight:700}
.cald i{width:3px;height:3px;border-radius:50%;background:var(--accent);display:block}
.cald.sel i{background:#241a08}
.callg{display:flex;gap:11px;margin-top:6px;font-size:9px;color:var(--ink3)}
.callg span{display:flex;align-items:center;gap:4px}
.callg i{width:3px;height:3px;border-radius:50%;background:var(--accent);display:block}
.callg b{width:7px;height:7px;box-shadow:inset 0 0 0 1px var(--ink3);display:block}
/* roll call — the aside's growable child */
.rc{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.rch{height:22px;display:flex;align-items:center;gap:7px;padding:0 11px;font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:1.3px;color:var(--ink3);background:var(--bg);border-bottom:1px solid var(--line);flex:none}
.rch b{color:var(--good);font-weight:400}
.rch em{margin-left:auto;font-style:normal;color:var(--ink3)}
.rcl{flex:1;overflow-y:auto;min-height:0}
.rcr{width:100%;height:24px;display:flex;align-items:center;gap:8px;padding:0 11px;border-bottom:1px solid var(--line);position:relative}
.rcr:hover,.rcr.hi{background:var(--panel2)}
.rcr .sq{width:7px;height:7px;flex:none;display:block}
.rcr .oc{font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:600;color:var(--ink2);min-width:32px;flex:none}
.rcr.lit .oc{color:var(--ink)}
.rcr .st{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:1px;color:var(--ink3);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcr.lit .st{color:var(--good)}
.rcr .jp{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--ink3);flex:none}
.rcr:hover .jp{color:var(--accent)}
.rcr .mb{width:24px;height:5px;flex:none;background:var(--panel3);position:relative;overflow:hidden}
.rcr .mb i{position:absolute;top:0;bottom:0;background:var(--accent);display:block}
/* TRANSPORT */
.tbar{height:38px;background:var(--bg);border-top:1px solid var(--line2);display:flex;align-items:stretch;flex:none}
.tg{display:flex;align-items:stretch}
.tb{min-width:34px;height:100%;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 9px;font-size:11px;color:var(--ink2);border-right:1px solid var(--line);flex:none;white-space:nowrap}
.tb:hover{background:var(--panel2);color:var(--ink)}
.tb[disabled]{opacity:.32;cursor:default}
.tb[disabled]:hover{background:none}
.tb.pri{width:42px;font-size:14px;color:var(--ink)}
.tb .mn{font-family:'JetBrains Mono',monospace;font-size:11px}
.tb.on{background:var(--accent);color:#241a08;font-weight:700}
.tb.ev.on{background:var(--accentSoft);color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
.tb.exp{color:var(--good)}
.tb.exp:hover{background:rgba(142,185,107,.14)}
.tb.live{color:var(--bad)}
.tb.live:hover{background:rgba(217,102,73,.16)}
.tb.live i{width:6px;height:6px;border-radius:50%;background:var(--bad);display:block;flex:none}
.tspacer{flex:1;border-right:1px solid var(--line);min-width:0}
.tsep{width:1px;background:var(--line2);flex:none}
/* SCRUBBER */
.scrub{flex:none;background:var(--trough);border-top:1px solid var(--line2);position:relative;display:flex;flex-direction:column;user-select:none}
.sgrip{position:absolute;left:0;right:0;top:-3px;height:7px;cursor:ns-resize;z-index:14}
.sgrip::after{content:"";position:absolute;left:50%;top:3px;width:36px;height:1px;margin-left:-18px;background:var(--line2)}
.sgrip:hover::after,.sgrip.on::after{background:var(--accent);height:2px}
.slbl{width:72px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;padding:0 8px;gap:3px}
.slbl span{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:1.2px;line-height:1}
.srow{display:flex;align-items:stretch;flex:none}
.strack{flex:1;min-width:0;position:relative}
.cov{height:14px;position:relative;background:#100f0d;border-bottom:1px solid var(--line)}
.cov i{position:absolute;top:2px;bottom:2px;display:block;min-width:1px}
.cov .rdy{background:var(--ready)}
.cov .wrm{background:var(--warm)}
.cov .lbl{position:absolute;left:5px;top:2px;font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:1.2px;color:var(--ink3)}
.ruler{height:15px;position:relative;border-bottom:1px solid var(--line)}
.ruler i{position:absolute;top:0;width:1px;background:var(--line2);display:block}
.ruler span{position:absolute;top:3px;font-family:'JetBrains Mono',monospace;font-size:8.5px;color:var(--ink3);transform:translateX(-50%);white-space:nowrap}
.lanes{flex:1;min-height:0;overflow:hidden;position:relative}
.lane{position:relative;width:100%}
.lane.z{background:rgba(255,255,255,.017)}
.lane.hi{background:var(--accentSoft)}
.lane i{position:absolute;top:1px;bottom:1px;background:var(--accent);display:block;min-width:1px}
.lane .lo{position:absolute;left:4px;top:0;bottom:0;display:flex;align-items:center;font-family:'JetBrains Mono',monospace;font-size:8px;color:rgba(110,102,87,.85);z-index:2;pointer-events:none}
.lane.dk{background:repeating-linear-gradient(135deg,rgba(217,102,73,.05) 0 4px,transparent 4px 8px)}
.phd{position:absolute;top:0;bottom:0;width:2px;background:#fff;z-index:10;pointer-events:none}
.phd b{position:absolute;top:-1px;left:-4px;width:10px;height:10px;background:#fff;display:block;transform:rotate(45deg);transform-origin:center}
.hovl{position:absolute;top:0;bottom:0;width:1px;background:rgba(240,236,228,.4);z-index:9;pointer-events:none}
.htip{position:absolute;bottom:100%;transform:translateX(-50%);margin-bottom:3px;background:var(--ink);color:var(--bg);font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:600;padding:2px 6px;white-space:nowrap;z-index:20;pointer-events:none}
.selr{position:absolute;top:0;bottom:0;background:rgba(232,161,58,.13);box-shadow:inset 1px 0 0 var(--accent),inset -1px 0 0 var(--accent);z-index:8;pointer-events:none}
.selr em{position:absolute;top:0;font-family:'JetBrains Mono',monospace;font-size:8px;font-style:normal;background:var(--accent);color:#241a08;padding:0 3px;line-height:11px}
.selr em.a{left:0}.selr em.b{right:0}
.selchip{position:absolute;left:0;bottom:2px;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--accent);background:rgba(22,20,15,.9);padding:1px 5px;z-index:11;white-space:nowrap;box-shadow:inset 0 0 0 1px var(--accentDim)}
/* modal */
.scrim{position:absolute;inset:0;z-index:60;background:rgba(13,12,11,.66);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center}
.modal{width:470px;max-height:74%;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line2);display:flex;flex-direction:column;overflow:hidden}
.mhd{padding:11px 13px 10px;border-bottom:1px solid var(--line);flex:none}
.mhd .t1{font-size:14px;font-weight:600}
.mhd .t2{font-size:11px;color:var(--ink3);margin-top:2px}
.msrch{height:32px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 12px;flex:none;background:var(--bg);box-shadow:inset 0 0 0 1px var(--accent)}
.msrch input{flex:1;min-width:0;font-family:'JetBrains Mono',monospace;font-size:11.5px;caret-color:var(--accent)}
.msrch input::placeholder{font-family:'Space Grotesk',sans-serif;color:var(--ink3)}
.mlist{flex:1;overflow-y:auto;min-height:0}
.mrow{width:100%;display:flex;align-items:center;gap:9px;padding:6px 12px;border-bottom:1px solid var(--line)}
.mrow:hover{background:var(--panel2)}
.mrow .cb{width:13px;height:13px;flex:none;display:grid;place-items:center;font-size:9px;color:transparent;box-shadow:inset 0 0 0 1px var(--line2);background:var(--bg)}
.mrow.on .cb{background:var(--accent);color:var(--bg);box-shadow:inset 0 0 0 1px var(--accent)}
.mrow .nm{flex:1;min-width:0}
.mrow .nm b{display:block;font-size:11.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow .nm span{display:block;font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--ink3);margin-top:1px}
.mrow .ow{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:1.1px;color:var(--accent);box-shadow:inset 0 0 0 1px var(--accentDim);padding:1px 4px;flex:none}
.mft{padding:9px 12px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;flex:none}
.mft .c{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink3)}
.mft .c.max{color:var(--bad)}
.mft button{font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.8px;padding:6px 11px;color:var(--ink2);box-shadow:inset 0 0 0 1px var(--line2)}
.mft button:hover{background:var(--panel2);color:var(--ink)}
.mft button.pri{margin-left:auto;background:var(--accent);color:#241a08;font-weight:700;box-shadow:none}
.mft button.pri[disabled]{opacity:.4;cursor:default}
.mft button.gh{margin-left:auto}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="wall-playback-core.jsx"></script>
<script type="text/babel" src="wall-playback-parts.jsx"></script>
<script type="text/babel">
const {useState,useEffect,useRef,useMemo,useCallback,useLayoutEffect}=React;
const {useTweaks,TweaksPanel,TweakSection,TweakRadio,TweakToggle}=window;
const {S,MIN,HR,DAY,NOW,TODAY,RET,RET0,dayStart,pad,hms,hm,ms3,dmy,wdy,durTxt,MO,WD1,T,
  ROSTER,GROUPS,WALL_DEFAULT,segsFor,motionFor,wallDays,litAt,nearestSeg,Scene,SPANS,tickStep}=window.WPCore;
const {Aside,Modal,Scrubber,Ribbon}=window.WPParts;

const TWEAK_DEFAULTS=/*EDITMODE-BEGIN*/{
  "archive":"ribbon",
  "cams":"14",
  "lit":"typical",
  "span":"1h",
  "motion":"typical",
  "state":"normal",
  "lang":"EN",
  "windowW":"1440"
}/*EDITMODE-END*/;

function App(){
  const [tw,setTweak]=useTweaks(TWEAK_DEFAULTS);
  const L=tw.lang,W=parseInt(tw.windowW,10),t=T[L];
  const nCams=parseInt(tw.cams,10);

  const [wall,setWall]=useState(()=>WALL_DEFAULT.slice(0,14));
  const [group,setGroup]=useState('outside');
  const [ph,setPh]=useState(NOW-37*MIN);
  const [playing,setPlaying]=useState(false);
  const [spanKey,setSpanKey]=useState('1h');
  const [calDay,setCalDay]=useState(null);
  const [zoom,setZoom]=useState(null);
  const [lanesOn,setLanesOn]=useState(true);
  const [sel,setSel]=useState(null);
  const [hoverCam,setHoverCam]=useState(null);
  const [prove,setProve]=useState(false);
  const [scrubH,setScrubH]=useState(160);
  const [modal,setModal]=useState(null);
  const [drag,setDrag]=useState(null);
  const [warmT,setWarmT]=useState(0);
  const showRib=tw.archive!=='calendar';
  const days=useMemo(()=>wallDays(tw.lit),[tw.lit]);
  const selDay=useMemo(()=>Math.max(0,Math.min(RET-1,Math.round((dayStart(ph)-RET0)/DAY))),[ph]);
  const phRef=useRef(ph),raf=useRef(0),last=useRef(0),stageRef=useRef(null),trackRef=useRef(null);

  useEffect(()=>{setWall(WALL_DEFAULT.slice(0,nCams));},[nCams]);
  useEffect(()=>{setSpanKey(tw.span);setZoom(null);setCalDay(null);},[tw.span]);

  /* ── window model: rolling preset (ends now) vs calendar day (00:00 → 24h) ── */
  const win=useMemo(()=>{
    if(calDay!=null){const a=RET0+calDay*DAY;return {a,b:Math.min(a+DAY,NOW),mode:'cal'};}
    const sp=SPANS.find(s=>s[0]===spanKey)[1];return {a:NOW-sp,b:NOW,mode:'roll'};
  },[calDay,spanKey]);
  const view=useMemo(()=>zoom?{a:Math.max(win.a,zoom.a),b:Math.min(win.b,zoom.b)}:win,[zoom,win]);

  const cams=useMemo(()=>wall.map(o=>ROSTER.find(c=>c.oct===o)).filter(Boolean),[wall]);
  const segs=useMemo(()=>{const m={};cams.forEach(c=>m[c.oct]=segsFor(c.oct,win.a,win.b,tw.lit));return m;},[cams,win.a,win.b,tw.lit]);
  const mots=useMemo(()=>{const m={};cams.forEach(c=>m[c.oct]=motionFor(c.oct,win.a,win.b,tw.motion));return m;},[cams,win.a,win.b,tw.motion]);

  /* per-cell availability — the field we are asking the backend for */
  const litMap=useMemo(()=>{const m={};cams.forEach(c=>m[c.oct]=litAt(segs[c.oct],ph));return m;},[cams,segs,ph]);
  const litN=cams.filter(c=>litMap[c.oct]).length;
  const motNow=useMemo(()=>{const m={};cams.forEach(c=>m[c.oct]=(mots[c.oct]||[]).some(([a,b])=>ph>=a-2*S&&ph<=b+2*S));return m;},[cams,mots,ph]);

  /* coverage = union of every camera's segments; warming = the un-composited tail */
  const cov=useMemo(()=>{const all=[];cams.forEach(c=>(segs[c.oct]||[]).forEach(s=>all.push(s)));
    all.sort((x,y)=>x[0]-y[0]);const out=[];
    all.forEach(([a,b])=>{const l=out[out.length-1];if(l&&a<=l[1]+20*S)l[1]=Math.max(l[1],b);else out.push([a,b]);});
    return out;},[cams,segs]);
  const warmFrom=useMemo(()=>win.b-(warmT?0:Math.min((win.b-win.a)*0.12,25*MIN)),[win,warmT]);

  const st=tw.state;
  const blocked=st==='pending'||st==='failed'||st==='emptyGroup';
  const noFootage=st==='noFootage'||(!blocked&&cov.length===0);

  const applyPh=useCallback(v=>{const n=Math.max(win.a,Math.min(win.b,v));phRef.current=n;setPh(n);},[win.a,win.b]);
  const nudge=useCallback(d=>applyPh(phRef.current+d),[applyPh]);
  useEffect(()=>{if(ph<win.a||ph>win.b)applyPh(Math.min(win.b,Math.max(win.a,ph)));},[win.a,win.b]);

  useEffect(()=>{if(!playing||blocked||noFootage){cancelAnimationFrame(raf.current);return;}
    last.current=performance.now();
    const step=now=>{const dt=now-last.current;last.current=now;applyPh(phRef.current+dt);
      raf.current=requestAnimationFrame(step);};
    raf.current=requestAnimationFrame(step);
    return()=>cancelAnimationFrame(raf.current);},[playing,blocked,noFootage,applyPh]);

  const setSpan=k=>{setSpanKey(k);setCalDay(null);setZoom(null);};
  const onCalDay=i=>{setCalDay(i);setZoom(null);
    const a=RET0+i*DAY;applyPh(Math.min(a+12*HR,Math.min(a+DAY,NOW)));};
  const markIn=useCallback(()=>{const p=phRef.current;setSel(s=>[p,s&&s[1]>p?s[1]:p+60*S]);},[]);
  const markOut=useCallback(()=>{const p=phRef.current;setSel(s=>[s&&s[0]<p?s[0]:p-60*S,p]);},[]);

  useEffect(()=>{const h=e=>{
    if(e.target.tagName==='INPUT')return;
    const c=e.code;
    if(c==='Escape'){if(modal){setModal(null);return;}if(sel){setSel(null);return;}setZoom(null);return;}
    if(c==='Space'){e.preventDefault();if(!blocked&&!noFootage)setPlaying(p=>!p);return;}
    if(c==='ArrowLeft'){e.preventDefault();nudge(-(e.shiftKey?60:10)*S);return;}
    if(c==='ArrowRight'){e.preventDefault();nudge((e.shiftKey?60:10)*S);return;}
    if(c==='BracketLeft'){e.preventDefault();markIn();return;}
    if(c==='BracketRight'){e.preventDefault();markOut();return;}
    if(c==='KeyX'){e.preventDefault();if(sel)setModal('export');return;}
    if(c==='KeyE'){e.preventDefault();setLanesOn(v=>!v);return;}
    if(c==='KeyT'){if(!e.repeat)setProve(true);return;}
    if(c==='Digit0'||c==='Home'){e.preventDefault();setZoom(null);return;}
    if(/^Digit[1-5]$/.test(c)){e.preventDefault();setSpan(SPANS[+c.slice(5)-1][0]);return;}
  };
  const up=e=>{if(e.code==='KeyT')setProve(false);};
  window.addEventListener('keydown',h);window.addEventListener('keyup',up);
  return()=>{window.removeEventListener('keydown',h);window.removeEventListener('keyup',up);};},
  [modal,sel,blocked,noFootage,nudge,markIn,markOut]);

  /* the composited picture is ONE video: letterbox the 16:9 mosaic, overlay a 4×4 cell map */
  const [box,setBox]=useState({w:1000,h:562,l:0,tp:0});
  const fit=useCallback(()=>{const el=stageRef.current;if(!el)return;
    const r=el.getBoundingClientRect(),ar=16/9;
    let w=r.width,h=w/ar;if(h>r.height){h=r.height;w=h*ar;}
    setBox(v=>{const n={w:Math.round(w),h:Math.round(h),l:Math.round((r.width-w)/2),tp:Math.round((r.height-h)/2)};
      return (n.w===v.w&&n.h===v.h&&n.l===v.l&&n.tp===v.tp)?v:n;});},[]);
  useLayoutEffect(fit,[fit,W,scrubH,lanesOn]);
  useEffect(()=>{const el=stageRef.current;if(!el||!window.ResizeObserver)return;
    const ro=new ResizeObserver(fit);ro.observe(el);return()=>ro.disconnect();},[fit]);

  const cw=box.w/4,chh=box.h/4;
  const swapCells=(from,to)=>{setWall(w=>{const n=[...w];
    while(n.length<16)n.push(null);
    const a=n[from],b=n[to];n[from]=b;n[to]=a;
    while(n.length&&n[n.length-1]==null)n.pop();return n;});};

  const Cell=({idx})=>{
    const oct=wall[idx],cam=oct!=null?ROSTER.find(c=>c.oct===oct):null;
    const style={left:(idx%4)*cw,top:Math.floor(idx/4)*chh,width:cw,height:chh,position:'absolute'};
    if(!cam)return <div className={'cell empt'+(drag&&drag.over===idx?' drop':'')} style={style}
      onDragOver={e=>{if(drag){e.preventDefault();setDrag(d=>({...d,over:idx}));}}}
      onDrop={e=>{e.preventDefault();if(drag){swapCells(drag.from,idx);setDrag(null);}}}>
      <button onClick={()=>setModal({k:'cell',idx})}>+ {t.addCam}</button></div>;
    const lit=litMap[oct],mn=motNow[oct];
    const near=lit?null:nearestSeg(segs[oct],ph);
    return <div className={'cell'+(lit?' lit':' dorm')+(mn&&lit?' mot':'')+(hoverCam===oct?' hi':'')
        +(drag&&drag.from===idx?' drag':'')+(drag&&drag.over===idx?' drop':'')}
      style={style} draggable onDragStart={e=>{setDrag({from:idx,over:idx});
        try{e.dataTransfer.setData('text/plain',String(idx));}catch(x){}
        const im=document.createElement('canvas');im.width=im.height=1;
        try{e.dataTransfer.setDragImage(im,0,0);}catch(x){}}}
      onDragEnd={()=>setDrag(null)}
      onDragOver={e=>{if(drag){e.preventDefault();setDrag(d=>({...d,over:idx}));}}}
      onDrop={e=>{e.preventDefault();if(drag){swapCells(drag.from,idx);setDrag(null);}}}
      onMouseEnter={()=>setHoverCam(oct)} onMouseLeave={()=>setHoverCam(c=>c===oct?null:c)}
      onContextMenu={e=>{e.preventDefault();setModal({k:'cell',idx});}}>
      {lit&&<Scene oct={oct} t={ph} motion={mn}/>}
      {!lit&&<div className="dnone">
        <span className="k">{t.noRec}</span>
        {near?<button className="j" onClick={e=>{e.stopPropagation();applyPh(near.at);}}
          title={t.jumpT}>{near.dir<0?'←':'→'} {hm(near.at)}</button>
          :<span className="n">{t.noneInWin}</span>}
      </div>}
      <span className="coct"><b>.{oct}</b><span>{cam.model}</span></span>
      {lit&&mn&&<span className="cmot">{t.motionNow}</span>}
      {prove&&<span className="cchip">{hms(ph)}.{ms3(ph)}</span>}
      <span className="cgrip">
        <button title={t.swapT} onMouseDown={e=>e.stopPropagation()}
          onClick={e=>{e.stopPropagation();setModal({k:'cell',idx});}}>⇄</button>
        <button title={t.dragT} onMouseDown={e=>e.stopPropagation()}>✥</button>
      </span>
    </div>;};

  const covPct=useMemo(()=>{const tot=cov.reduce((a,[x,y])=>a+(Math.min(y,view.b)-Math.max(x,view.a)),0);
    return Math.max(0,Math.round(tot/(view.b-view.a)*100));},[cov,view]);

  const banner=(()=>{
    if(st==='pending')return {tag:t.tagPend,tc:'var(--accent)',t:t.pendT,s:t.pendS,btn:t.retLive};
    if(st==='failed')return {tag:'ERROR',tc:'var(--bad)',t:t.failT,s:t.failS,btn:t.retLive};
    if(st==='emptyGroup')return {tag:t.tagGroup,tc:'var(--ink3)',t:t.egT,s:t.egS,btn:null};
    if(noFootage)return {tag:t.tagFoot,tc:'var(--ink3)',t:t.nfT,s:t.nfS,btn:null};
    return null;})();

  return <div className="wrap">
    <div className="vbar">
      <span className="vsw">
        <a href="triage-camera-filter-prototype-B-lanes.html">TRIAGE · LANES</a>
        <a href="groups-redesign-prototype.html">GROUPS · WALL</a>
        <a href="playback-redesign-prototype.html">PLAYBACK · ONE AXIS</a>
        <a className="on" href="wall-playback-prototype.html">WALL · ROLL CALL</a>
      </span>
      <span className="vnote">Click a dark cell's <b>← time</b> to jump to what it did record · hold <b>T</b> to prove sync · <b>[ ]</b> mark · <b>1–5</b> span · wheel to zoom the scrubber</span>
    </div>
    <div className="frame" style={{width:W}} data-screen-label="Wall playback">
      <div className="titlebar"><span className="tt">WATCHTOWER · <b>{t.title}</b></span>
        <span className="dots"><i style={{background:'var(--line2)'}}></i><i style={{background:'var(--line2)'}}></i><i style={{background:'var(--bad)'}}></i></span></div>
      <div className="topbar">
        <div className="tcell"><div className="brand"><div className="b1">CILEX VISION</div><div className="b2">Watchtower<em>79ae8583</em></div></div></div>
        <div className="tcell grow"><span style={{color:'var(--ink3)'}}>⌕</span>
          <span className="searchc">{t.search}</span><span className="kbd">CTRL K</span></div>
        {[['good',t.pOnline,39],['bad',t.pOffline,0],['accent',t.pNotRec,0]].map(([c,l,n])=>
          <div className="tcell" key={l} style={{padding:'0 3px'}}>
            <button className="pilb" title={t.pillT(l)}><i style={{background:'var(--'+c+')'}}></i>{l} {n}<span className="go">↗</span></button>
          </div>)}
        <div className="tcell"><button className="chk"><span style={{fontSize:11,color:'var(--ink3)'}}>⊙</span>{t.checkIn}</button></div>
        <div className="tcell"><span className="pill">{hm(NOW)} · UTC+3</span></div>
        <div className="tcell" style={{padding:0}}><div style={{width:34,height:'100%',background:'var(--accent)',color:'#241a08',display:'grid',placeItems:'center',fontSize:11,fontWeight:700}}>AD</div></div>
      </div>
      <div className="body">
        <div className="rail">
          {[[t.rLive,1],[t.rGroups,0],[t.rViews,0],[t.rEvents,0],[t.rHealth,0]].map(([n,on])=>
            <div key={n} className={'railitem'+(on?' on':'')}><span className="g"></span>{n}
              {n===t.rEvents&&<span className="bd">100</span>}</div>)}
        </div>
        <div className="mid">
          <div className="stagerow">
            <div className="stage" ref={stageRef}>
              <div className="grid" style={{left:box.l,top:box.tp,width:box.w,height:box.h}}>
                {!banner&&Array.from({length:16},(_,i)=><Cell key={i} idx={i}/>)}
              </div>
              {banner&&<div className="wbanner">
                <span className="bi" style={{color:banner.tc,boxShadow:'inset 0 0 0 1px '+banner.tc}}>{banner.tag}</span>
                <span className="bt">{banner.t}</span><span className="bs">{banner.s}</span>
                {banner.btn&&<button>{banner.btn}</button>}
              </div>}
            </div>
            <Aside L={L} t={t} cams={cams} litMap={litMap} motNow={motNow} segs={segs} mots={mots}
              group={group} setGroup={g=>{setGroup(g);const gg=GROUPS.find(x=>x.id===g);
                if(gg&&gg.n>0)setWall(ROSTER.filter(c=>g==='all'||c.group===g).slice(0,16).map(c=>c.oct));}}
              win={win} view={view} spanKey={spanKey} calDay={calDay} onCalDay={onCalDay}
              ph={ph} covPct={covPct} hoverCam={hoverCam} setHoverCam={setHoverCam}
              onJump={applyPh} onEdit={()=>setModal({k:'edit'})} showCal={!showRib} days={days}/>
          </div>
          <div className="tbar">
            <div className="tg">
              <button className="tb pri" onClick={()=>setPlaying(p=>!p)} disabled={blocked||noFootage}
                title={playing?t.pause:t.play}>{playing?'❚❚':'▶'}</button>
              <button className="tb" onClick={()=>nudge(-10*S)} disabled={blocked} title={t.b10}><span className="mn">−10s</span></button>
              <button className="tb" onClick={()=>nudge(10*S)} disabled={blocked} title={t.f10}><span className="mn">+10s</span></button>
              <button className="tb" onClick={()=>{setSpan('1h');applyPh(NOW-30*MIN);}}>{t.lastHour}</button>
              <button className="tb" onClick={()=>{setSpan('15m');applyPh(NOW-7*MIN);}}>{t.last15}</button>
            </div>
            <span className="tspacer"></span>
            <div className="tg">
              <span className="tb" style={{cursor:'default',color:'var(--ink3)'}}>
                <span className="mn" style={{color:'var(--ink2)'}}>{covPct}%</span>&nbsp;{t.covered}</span>
              <span className="tsep"></span>
              {SPANS.map(([k,,lbl])=><button key={k} className={'tb'+(calDay==null&&!zoom&&spanKey===k?' on':'')}
                onClick={()=>setSpan(k)} title={t.spanT(lbl)}><span className="mn">{lbl}</span></button>)}
              {zoom&&<button className="tb on" onClick={()=>setZoom(null)}>{t.fit}</button>}
              <button className={'tb ev'+(lanesOn?' on':'')} onClick={()=>setLanesOn(v=>!v)}>{t.events}</button>
              {sel&&<button className="tb exp" onClick={()=>setModal({k:'export'})}>
                ↥ {t.exportSel} · {durTxt(sel[1]-sel[0],L)}</button>}
              <button className="tb live"><i></i>{t.retLive}</button>
            </div>
          </div>
          {showRib&&<Ribbon L={L} t={t} days={days} selDay={selDay} onDay={onCalDay} win={win}
            litDayTotal={cams.length}/>}
          <Scrubber L={L} t={t} cams={cams} segs={segs} mots={mots} cov={cov} warmFrom={warmFrom}
            view={view} win={win} ph={ph} sel={sel} setSel={setSel} onSeek={applyPh}
            h={scrubH} setH={setScrubH} lanesOn={lanesOn} litMap={litMap}
            hoverCam={hoverCam} setHoverCam={setHoverCam} zoom={zoom} setZoom={setZoom} trackRef={trackRef}/>
        </div>
      </div>
      {modal&&<Modal L={L} t={t} m={modal} wall={wall} setWall={setWall} close={()=>setModal(null)}
        sel={sel} cams={cams}/>}
    </div>
    <TweaksPanel>
      <TweakSection label="Layout"/>
      <TweakRadio label="Archive" value={tw.archive} options={['ribbon','calendar']} onChange={v=>setTweak('archive',v)}/>
      <TweakSection label="The wall"/>
      <TweakRadio label="Cameras" value={tw.cams} options={['4','14','16']} onChange={v=>setTweak('cams',v)}/>
      <TweakRadio label="Lit cells" value={tw.lit} options={['sparse','typical','busy']} onChange={v=>setTweak('lit',v)}/>
      <TweakRadio label="Motion" value={tw.motion} options={['quiet','typical','heavy']} onChange={v=>setTweak('motion',v)}/>
      <TweakSection label="Time"/>
      <TweakRadio label="Span" value={tw.span} options={['15m','1h','6h','24h']} onChange={v=>setTweak('span',v)}/>
      <TweakSection label="Honest states"/>
      <TweakRadio label="State" value={tw.state} options={['normal','noFootage','pending','failed','emptyGroup']} onChange={v=>setTweak('state',v)}/>
      <TweakSection label="Review harness"/>
      <TweakRadio label="Language" value={tw.lang} options={['EN','RU']} onChange={v=>setTweak('lang',v)}/>
      <TweakRadio label="Window" value={tw.windowW} options={['1920','1440','1200']} onChange={v=>setTweak('windowW',v)}/>
    </TweaksPanel>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
