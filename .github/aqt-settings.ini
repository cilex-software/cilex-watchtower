; aqtinstall settings for CI (referenced by AQT_CONFIG in .github/workflows/windows.yml).
; Works around the frequent "Failed to download checksum for Updates.xml / Failed to locate
; XML data" flake when download.qt.io's hash file is momentarily unavailable: retry the hash,
; and fall back to full mirrors that carry the same .sha256 files.
[requests]
connection_timeout = 30
response_timeout = 30
max_retries_on_connection_error = 5
retry_backoff = 0.5
max_retries_on_checksum_error = 5
max_retries_to_retrieve_hash = 8

[mirrors]
trusted_mirrors =
    https://download.qt.io
fallbacks =
    https://mirrors.ocf.berkeley.edu/qt
    https://ftp.fau.de/qtproject
    https://qt-mirror.dannhauer.de
    https://mirror.accum.se/mirror/qt.io/qtproject
