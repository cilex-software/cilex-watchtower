name: windows

# A Windows watchtower.exe + installer on every code change (W1 of the Windows port —
# docs/plans/windows-port/W1-ci-pipeline.prompt.md). Docs-only pushes are skipped so a
# ~15-25 min Windows build isn't burned on prose. Artifacts land on each run's page.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '**/*.prompt.md'
      - '.claude/**'
      - 'memory/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '**/*.prompt.md'
      - '.claude/**'
  workflow_dispatch: {}

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: 6.12.0          # MANDATORY per the port plan — never fall back to 6.8.x
  GST_VERSION: 1.26.11        # GStreamer MSVC runtime + devel (verified downloadable 2026-07-04)

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write        # publish the built exe to a rolling Release (below)
    steps:
      - uses: actions/checkout@v4

      # Qt 6.12 msvc2022_64 via aqtinstall. Sets QT_ROOT_DIR + adds <qt>/bin to PATH
      # (windeployqt) for later steps. qtmultimedia = the FFmpeg media backend; base
      # covers Core/Gui/Qml/Quick/QuickControls2/Sql/Network/ShaderTools.
      #
      # aqtsource = git master: released aqtinstall 3.3.0 CANNOT resolve Qt 6.12.0 —
      # its all_extensions() returns [''] for 6.12 desktop, so it builds the folder
      # qt6_6120/qt6_6120/Updates.xml (404, "Failed to locate XML data") instead of the
      # arch-split qt6_6120/qt6_6120_msvc2022_64/Updates.xml that Qt 6.12 actually uses.
      # master (3.3.1.dev) knows the split layout (verified locally). Revert to a pinned
      # release once one ships with the 6.12 desktop arch-split fix.
      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          # qtmultimedia = the FFmpeg media backend. (LinguistTools / lrelease, needed by
          # qt_add_translations for i18n, ship in BASE Qt — not a separate aqt module.)
          modules: qtmultimedia
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git'
          cache: true

      # cl.exe + the MSVC toolchain in PATH so the Ninja generator finds the compiler.
      - name: Set up MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install build tools (ninja, pkg-config, NSIS)
        shell: pwsh
        run: choco install ninja pkgconfiglite nsis -y --no-progress

      - name: Cache GStreamer MSIs
        id: gst-cache
        uses: actions/cache@v4
        with:
          path: gst-msi
          key: gst-${{ env.GST_VERSION }}-msvc-x86_64

      - name: Download GStreamer ${{ env.GST_VERSION }} (runtime + devel)
        if: steps.gst-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path gst-msi | Out-Null
          $base = "https://gstreamer.freedesktop.org/data/pkg/windows/$env:GST_VERSION/msvc"
          foreach ($k in @('', 'devel-')) {
            $f = "gstreamer-1.0-${k}msvc-x86_64-$env:GST_VERSION.msi"
            Write-Host "Downloading $f"
            Invoke-WebRequest -Uri "$base/$f" -OutFile "gst-msi/$f"
          }

      # Administrative-extract (/a TARGETDIR) both MSIs to a known dir — a silent /i
      # install returned exit 0 but landed nothing at the expected path. /a deterministically
      # unpacks the full tree (bin/lib/include/lib/pkgconfig/lib/gstreamer-1.0); GStreamer
      # 1.26 .pc files are relocatable (${pcfiledir}), so the extract works for build +
      # bundling. Then DISCOVER the real pkgconfig dir and export PKG_CONFIG_PATH (inherited
      # by pkg_check_modules(GST ...)) + GSTREAMER_ROOT (used by deploy.ps1).
      - name: Install GStreamer
        shell: pwsh
        run: |
          $target = "C:\gst"
          foreach ($k in @('', 'devel-')) {
            $f = (Resolve-Path "gst-msi/gstreamer-1.0-${k}msvc-x86_64-$env:GST_VERSION.msi").Path
            Write-Host "Extracting $f"
            $p = Start-Process msiexec.exe -ArgumentList "/a `"$f`" /qn TARGETDIR=`"$target`"" -Wait -PassThru
            Write-Host "  msiexec exit=$($p.ExitCode)"
          }
          Write-Host "== searching for gstreamer-1.0.pc under $target =="
          $pc = Get-ChildItem -Path $target -Recurse -Filter "gstreamer-1.0.pc" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $pc) {
            Write-Host "!! gstreamer-1.0.pc NOT found. Extracted tree (2 levels):"
            Get-ChildItem -Path $target -Recurse -Depth 2 -ErrorAction SilentlyContinue | Select-Object FullName | Format-Table -AutoSize
            throw "GStreamer devel .pc files missing after extract."
          }
          $pcdir = $pc.Directory.FullName                       # ...\lib\pkgconfig
          $root  = $pc.Directory.Parent.Parent.FullName         # ...\msvc_x86_64
          Write-Host "== .pc dir: $pcdir ==  == root: $root =="
          Get-ChildItem $pcdir -Filter "gstreamer-*.pc" | ForEach-Object { Write-Host "   $($_.Name)" }
          "GSTREAMER_ROOT=$root"   | Out-File -FilePath $env:GITHUB_ENV -Append
          "PKG_CONFIG_PATH=$pcdir" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "== pkg-config sanity =="
          pkg-config --version
          $env:PKG_CONFIG_PATH = $pcdir
          pkg-config --exists gstreamer-1.0; Write-Host "gstreamer-1.0 exists exit=$LASTEXITCODE"
          pkg-config --modversion gstreamer-1.0

      # The `windows` preset (CMakePresets.json) reads QT_ROOT_DIR (Qt prefix) and
      # GSTREAMER_ROOT (-> PKG_CONFIG_PATH for pkg_check_modules(GST ...)).
      - name: Configure
        shell: pwsh
        run: cmake --preset windows

      - name: Build
        shell: pwsh
        run: cmake --build build-windows

      # windeployqt (Qt runtime/QML/plugins) + GStreamer LGPL subset + ffmpeg.exe.
      - name: Deploy runtime
        shell: pwsh
        run: >
          pwsh packaging/windows/deploy.ps1
          -ExePath (Resolve-Path build-windows/watchtower.exe).Path
          -QmlDir (Resolve-Path qml).Path
          -GstRuntime $env:GSTREAMER_ROOT

      # Compliance: every GStreamer plugin we actually SHIP must be documented in the LGPL
      # inventory — a bundled-but-undocumented plugin is a licence drift, so fail on it.
      - name: License compliance (shipped plugins are documented)
        shell: pwsh
        run: |
          $notice = "packaging/windows/licenses/NOTICE-GStreamer.txt"
          $dir = "build-windows/dist/lib/gstreamer-1.0"
          if (-not (Test-Path $dir)) { Write-Host "no plugins bundled — nothing to check"; exit 0 }
          $text = Get-Content $notice -Raw
          $bad = @()
          Get-ChildItem $dir -Filter "gst*.dll" | ForEach-Object {
            $name = $_.BaseName -replace '^gst',''
            if ($text -notmatch "\b$([regex]::Escape($name))\b") { $bad += $name }
          }
          if ($bad.Count -gt 0) {
            Write-Host "::error::Shipped GStreamer plugins not in NOTICE-GStreamer.txt: $($bad -join ', ')"
            exit 1
          }
          Write-Host "OK — all shipped GStreamer plugins are documented."

      - name: Build installer (NSIS)
        shell: pwsh
        working-directory: packaging/windows
        run: makensis installer.nsi

      # The Actions ARTIFACT storage quota is account-wide and recalculates only
      # every 6-12h, so a backlog blocks upload-artifact for hours (it did on
      # 2026-07-10: every build went green through compile/deploy/installer and
      # died on "Artifact storage quota has been hit"). RELEASE assets live in
      # separate storage NOT subject to that quota — publish the portable zip +
      # installer to a rolling prerelease so the latest Windows build is always
      # downloadable (gh release download windows-latest) regardless of quota.
      - name: Publish rolling windows-latest release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dist = "build-windows/dist"
          if (-not (Test-Path "$dist/watchtower.exe")) { throw "no watchtower.exe under $dist" }
          Compress-Archive -Path "$dist/*" -DestinationPath "watchtower-windows-portable.zip" -Force
          $assets = @((Resolve-Path "watchtower-windows-portable.zip").Path)
          $installer = Get-ChildItem packaging/windows/CilexWatchtower-*-setup.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($installer) { $assets += $installer.FullName }
          $tag = "windows-latest"
          gh release delete $tag --yes --cleanup-tag 2>$null   # native exit ignored; recreated below
          gh release create $tag $assets --prerelease --target $env:GITHUB_SHA `
            --title "Windows CI build (latest main)" `
            --notes "Rolling CI build of $env:GITHUB_SHA. Ephemeral — overwritten on every build."

      # Kept for backward compat, but non-fatal: the quota can reject these (see above).
      - name: Upload portable (exe + runtime)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: watchtower-portable
          path: build-windows/dist
          if-no-files-found: error
          # Default retention (90d) x ~150MB x every push blew the storage quota
          # (2026-07-10: 52 artifacts, 6.5GB, uploads shedding). CI artifacts are
          # grab-the-latest downloads - keep them days, not months.
          retention-days: 3

      - name: Upload installer
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: watchtower-setup
          path: packaging/windows/CilexWatchtower-*-setup.exe
          if-no-files-found: error
          retention-days: 3

  # Optional: publish a permanent versioned installer on a v* tag.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: watchtower-setup
          path: dist
      - name: Attach installer to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*-setup.exe
